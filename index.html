<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>滅火器檢查系統</title>
  <!-- 引入 html5-qrcode 高速條碼解碼庫 -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --primary: #7e9e8d;      /* 莫蘭迪綠主色 */
      --primary-dark: #5a7b66; /* 深灰綠底色 */
      --bg: #f8faf9;           /* 灰綠調白背景 */
      --card: #ffffff;
      --text: #333333;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; background: var(--bg); color: var(--text); padding-bottom: 30px;
    }
    .card {
      background: var(--card); margin: 12px; padding: 16px;
      border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .hidden { display: none !important; }
    
    /* 頂部導覽列 */
    #top-global-clock {
      background-color: var(--primary-dark); color: #ffffff;
      padding: 14px; text-align: center; font-size: 1.1rem; font-weight: bold;
    }
    .tabs {
      display: flex; background: #fff; border-bottom: 1px solid #ddd;
      position: sticky; top: 0; z-index: 100;
    }
    .tab-item {
      flex: 1; text-align: center; padding: 14px 5px; font-size: 15px;
      cursor: pointer; color: #777; transition: all 0.2s;
    }
    .tab-item.active {
      color: var(--primary-dark); border-bottom: 3px solid var(--primary-dark); font-weight: bold;
    }

    /* 按鈕與輸入框 */
    button {
      background: var(--primary); color: white; border: none; padding: 12px;
      border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer;
      font-size: 16px; margin-top: 8px; transition: 0.2s;
    }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    button.btn-secondary { background: #888888; }
    button.btn-danger { background: #d9534f; }
    button.btn-success { background: #5cb85c; }
    button.btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
    
    .btn-sm {
      width: auto !important; margin-top: 0 !important; padding: 6px 12px !important;
      font-size: 13px !important; border-radius: 6px !important;
    }
    input, select {
      width: 100%; padding: 12px; margin: 6px 0; border: 1px solid #ddd;
      border-radius: 8px; box-sizing: border-box; font-size: 16px;
    }
    .date-roc-group {
      display: flex; align-items: center; gap: 4px; margin: 6px 0;
    }
    .date-roc-group input {
      text-align: center; padding: 10px 4px; margin: 0;
    }
    /* 彈窗設計 */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.6); display: none;
      justify-content: center; align-items: center; z-index: 1100;
    }
    #modal-alert {
      z-index: 1200;
    }
    #modal-confirm {
      z-index: 1250;
    }
    .modal-card {
      background: white; padding: 22px; border-radius: 16px; width: 88%;
      max-width: 320px; text-align: center; box-shadow: 0 5px 25px rgba(0,0,0,0.3);
      max-height: 85vh; overflow-y: auto;
    }
    .list-item {
      background: #fff; border: 1px solid #eee; border-radius: 8px; padding: 12px;
      margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
    }
    .list-badge {
      font-size: 12px; padding: 4px 8px; border-radius: 4px; color: white; display: inline-block;
    }
    .bg-red { background: #d9534f; }
    .bg-green { background: #5cb85c; }
    
    #sync-indicator {
      font-size: 12px; color: #888; text-align: center; margin-top: 5px; height: 16px;
    }
    
    /* 載入轉圈動畫 */
    .spinner {
      display: inline-block; width: 14px; height: 14px; border: 2px solid #fff;
      border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite;
      vertical-align: middle; margin-right: 4px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 掃描對焦紅線（固定中央，不上下移動） */
    .scanner-container-box {
      position: relative; width: 100%; overflow: hidden;
      border-radius: 12px; background: #000; min-height: 240px;
    }
    .scanner-laser-line {
      position: absolute; top: 50%; left: 8%; right: 8%; height: 2px;
      background: #ff0033; box-shadow: 0 0 8px #ff0033, 0 0 3px #ffffff;
      transform: translateY(-50%);
      z-index: 10; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="top-global-clock">滅火器檢查系統</div>
  <div id="v-login" class="card">
    <h3 style="text-align:center; color:var(--primary-dark);">人員登入</h3>
    <input type="text" id="loginId" placeholder="請輸入登入編號">
    <button id="loginBtn">確認登入</button>
  </div>
  <div id="tabs-bar" class="tabs hidden">
    <div id="t-scan" class="tab-item active" onclick="switchView('v-scan', 't-scan')">檢查</div>
    <div id="t-list" class="tab-item" onclick="switchView('v-list', 't-list'); renderList();">所有設備</div>
    <div id="t-user" class="tab-item" onclick="switchView('v-user', 't-user')">設定</div>
  </div>

  <div id="v-scan" class="card hidden">
    <button class="btn-success" style="margin-bottom: 12px; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px;" onclick="openScanner()">
      📷 掃描條碼檢查滅火器
    </button>

    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 2px solid var(--primary); padding-bottom: 5px;">
      <h4 style="color: var(--primary-dark); margin:0;">本月待檢查清單</h4>
      <select id="filter-sort-scan" style="width:auto; padding:6px; margin:0;" onchange="renderUninspectedList()">
        <option value="high_low">樓層 (高➔低)</option>
        <option value="low_high">樓層 (低➔高)</option>
      </select>
    </div>
    <div id="sync-indicator"></div>
    <div id="uninspected-list" style="margin-top:10px;">載入中...</div>
  </div>

  <div id="v-list" class="card hidden">
    <div style="display:flex; gap:10px;">
      <select id="filter-sort" onchange="renderList()">
        <option value="default">預設排序</option>
        <option value="new_old">到期日 (遠➔近)</option>
        <option value="old_new">到期日 (近➔遠)</option>
      </select>
      <select id="filter-status" onchange="renderList()">
        <option value="all">全部狀態</option>
        <option value="done">本月已檢查</option>
        <option value="undone">本月未檢查</option>
      </select>
    </div>
    <div id="all-data-list" style="margin-top: 15px;"></div>
  </div>

  <div id="v-user" class="card hidden">
    <h4 style="color:var(--primary-dark); margin-top:0;">當前使用者</h4>
    <p><strong>姓名：</strong><span id="user-name-display">-</span></p>
    <p><strong>編號：</strong><span id="user-id-display">-</span></p>
    <button class="btn-secondary" onclick="handleLogout()">登出系統</button>

    <hr style="margin:20px 0; border:0; border-top:1px solid #eee;">

    <h4 style="color:var(--primary-dark); margin-top:0;">手動新增滅火器</h4>
    <div style="text-align:left;">
      <label style="font-size:14px; font-weight:bold;">編號 *</label>
      <input type="text" id="add-id" placeholder="例如: EXT-001">
      
      <label style="font-size:14px; font-weight:bold;">樓層 *</label>
      <select id="add-floor">
        <option value="">請選擇樓層</option>
        <option value="1F">1F</option>
        <option value="2F">2F</option>
        <option value="3F">3F</option>
        <option value="4F">4F</option>
        <option value="5F">5F</option>
        <option value="6F">6F</option>
        <option value="7F">7F</option>
        <option value="8F">8F</option>
        <option value="9F">9F</option>
      </select>
      
      <label style="font-size:14px; font-weight:bold;">位置 *</label>
      <input type="text" id="add-location" placeholder="例如: 大門左側">
      
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:6px;">
        <label id="add-date-label" style="font-size:14px; font-weight:bold;">到期日 (西元年) *</label>
        <button type="button" class="btn-sm btn-outline" onclick="toggleAddCalendarType()" style="padding:2px 8px!important; font-size:12px!important;">切換為民國年</button>
      </div>
      <div class="date-roc-group">
        <input type="number" id="add-year" style="flex:1.2;"> 年
        <input type="number" id="add-month" min="1" max="12" style="flex:1;"> 月
        <input type="number" id="add-day" min="1" max="31" style="flex:1;"> 日
      </div>

      <button class="btn-success" style="margin-top:12px;" onclick="submitAdd()">新增設備</button>
    </div>
  </div>

  <!-- 相機條碼掃描彈窗 -->
  <div id="modal-scanner" class="modal-overlay">
    <div class="modal-card" style="max-width: 350px; padding: 18px;">
      <h4 style="color:var(--primary-dark); margin-top:0; margin-bottom: 10px;">條碼對齊掃描</h4>
      <div class="scanner-container-box">
        <div id="reader" style="width: 100%;"></div>
        <div class="scanner-laser-line"></div>
      </div>
      <p style="font-size: 13px; color: #666; margin: 10px 0;">請將滅火器條碼置於紅色對準線中央</p>
      <button class="btn-secondary" onclick="closeScanner()">關閉相機</button>
    </div>
  </div>

  <div id="modal-alert" class="modal-overlay">
    <div class="modal-card">
      <h4 id="alert-title" style="color:var(--primary-dark); margin-top:0;">提示</h4>
      <p id="alert-message" style="margin:16px 0;"></p>
      <button onclick="closeAlertModal()">確定</button>
    </div>
  </div>

  <!-- 新增：詢問是否新增滅火器確認彈窗 -->
  <div id="modal-confirm" class="modal-overlay">
    <div class="modal-card">
      <h4 id="confirm-title" style="color:var(--primary-dark); margin-top:0;">確認</h4>
      <p id="confirm-message" style="margin:16px 0; white-space: pre-line;"></p>
      <div style="display:flex; gap:10px;">
        <button class="btn-success" id="confirm-btn-yes">是，立即新增</button>
        <button class="btn-secondary" onclick="closeModal('modal-confirm')">否</button>
      </div>
    </div>
  </div>

  <div id="modal-ext-info" class="modal-overlay">
    <div class="modal-card" style="text-align:left;">
      <h4 style="text-align:center; color:var(--primary-dark); margin-top:0;">滅火器詳情與檢查</h4>
      <div id="ext-info-content" style="font-size:14px; line-height:1.8;"></div>
      <div style="margin-top:16px;">
        <button class="btn-success" onclick="submitCheckDirect(true)">正常</button>
        <button class="btn-danger" onclick="submitCheckDirect(false)">異常</button>
        <button class="btn-secondary" onclick="closeModal('modal-ext-info')">關閉</button>
      </div>
    </div>
  </div>

  <div id="modal-modify-ext" class="modal-overlay">
    <div class="modal-card" style="text-align:left;">
      <h4 style="text-align:center; color:var(--primary-dark); margin-top:0;">修改設備資料</h4>
      
      <label style="font-size:14px; font-weight:bold;">樓層</label>
      <select id="mod-floor">
        <option value="">請選擇樓層</option>
        <option value="1F">1F</option>
        <option value="2F">2F</option>
        <option value="3F">3F</option>
        <option value="4F">4F</option>
        <option value="5F">5F</option>
        <option value="6F">6F</option>
        <option value="7F">7F</option>
        <option value="8F">8F</option>
        <option value="9F">9F</option>
      </select>
      
      <label style="font-size:14px; font-weight:bold;">位置</label>
      <input type="text" id="mod-location">
      
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:6px;">
        <label id="mod-date-label" style="font-size:14px; font-weight:bold;">到期日 (西元年)</label>
        <button type="button" id="mod-date-btn" class="btn-sm btn-outline" onclick="toggleModCalendarType()" style="padding:2px 8px!important; font-size:12px!important;">切換為民國年</button>
      </div>
      <div class="date-roc-group">
        <input type="number" id="mod-year" style="flex:1.2;"> 年
        <input type="number" id="mod-month" min="1" max="12" style="flex:1;"> 月
        <input type="number" id="mod-day" min="1" max="31" style="flex:1;"> 日
      </div>
      
      <label style="font-size:14px; font-weight:bold;">壓力錶狀態</label>
      <select id="mod-pressure">
        <option value="正常">正常</option>
        <option value="異常">異常</option>
      </select>

      <button onclick="submitModify()">確認修改</button>
      <button class="btn-secondary" onclick="handleCancelModify()">取消</button>
    </div>
  </div>

  <script>
    // 部署之 Google Apps Script API 網址
    const API_URL = "https://script.google.com/macros/s/AKfycbyRUe4PUGsvo7AB64k1SLzkxZ5IlrWGYgndhWRzw3MBF4K-WxxD5pMD2s0hqx3LUnwl/exec";

    let currentUser = null;
    let selectedExt = null;
    let allData = []; 
    let modifySource = "info";
    let isAddRoc = false; 
    let isModRoc = false; 

    let currentModAdYear = ""; 
    let alertCallback = null;
    let html5QrcodeScanner = null;

    const now = new Date();
    const currentYear = now.getFullYear();
    const currentMonth = String(now.getMonth() + 1).padStart(2, '0');
    const currentMonthStr = `${currentYear}-${currentMonth}`;

    // 自動相容 GitHub Pages 與 Google Apps Script 通訊
    function callGasApi(action, payload) {
      return new Promise((resolve, reject) => {
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          let runner = google.script.run
            .withSuccessHandler(res => resolve(res))
            .withFailureHandler(err => reject(err));
          
          if (action === "checkLoginById") runner.checkLoginById(payload);
          else if (action === "getAllFireExtinguishers") runner.getAllFireExtinguishers();
          else if (action === "updateFireExtinguisherData") runner.updateFireExtinguisherData(payload);
          else if (action === "addFireExtinguisherData") runner.addFireExtinguisherData(payload);
        } else {
          fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: action, payload: payload })
          })
          .then(res => res.json())
          .then(res => resolve(res))
          .catch(err => reject(err));
        }
      });
    }

    /* 條碼相機掃描相關邏輯（強化弧形辨識與讀取判定） */
    function openScanner() {
      showModal("modal-scanner");
      if (!html5QrcodeScanner) {
        html5QrcodeScanner = new Html5Qrcode("reader");
      }

      // 1. 照片為典型的 CODE_128 / CODE_39，限定格式可節省運算並大幅降低誤判率
      const formats = (typeof Html5QrcodeSupportedFormats !== 'undefined') ? [
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39
      ] : undefined;

      // 2. 關鍵修正：將掃描框壓為「寬 300px、高 60px」的細長扁框，徹底避開上下黑色表格框線
      const config = {
        fps: 30,
        qrbox: { width: 300, height: 60 },
        aspectRatio: 1.0,
        experimentalFeatures: {
          useBarCodeDetectorIfSupported: true // 啟用手機原生硬體條碼解碼晶片
        }
      };
      if (formats) config.formatsToSupport = formats;

      // 3. 關鍵修正：請求 1920x1080 (1080p) 高解析度，確保弧形邊緣的細小線條仍有足夠像素辨識
      const cameraConfig = {
        facingMode: "environment",
        width: { min: 1280, ideal: 1920, max: 3840 },
        height: { min: 720, ideal: 1080, max: 2160 }
      };

      html5QrcodeScanner.start(
        cameraConfig,
        config,
        onScanSuccess,
        onScanFailure
      ).catch(err => {
        showAlert("相機開啟失敗", "請確認是否已給予網頁相機權限：" + err);
        closeScanner();
      });
    }

    function stopScanner() {
      if (html5QrcodeScanner && html5QrcodeScanner.isScanning) {
        return html5QrcodeScanner.stop().catch(err => console.error(err));
      }
      return Promise.resolve();
    }

    function closeScanner() {
      stopScanner().then(() => {
        closeModal("modal-scanner");
      });
    }

    function onScanSuccess(decodedText) {
      stopScanner().then(() => {
        closeModal("modal-scanner");
        const scannedCode = String(decodedText).trim();
        
        // 搜尋匹配的滅火器編號
        const foundExt = allData.find(d => String(d.code).trim() === scannedCode);
        
        if (foundExt) {
          selectedExt = { rowIndex: foundExt.rowIndex, data: foundExt };
          renderExtInfo(selectedExt.data);
          showModal("modal-ext-info");
        } else {
          // 修正：掃描到系統無紀錄條碼時，詢問是否新增滅火器
          showConfirmModal(
            "查無條碼紀錄",
            `系統中查無編號「${scannedCode}」的滅火器！\n是否要立即新增此滅火器？`,
            function() {
              switchView('v-user', 't-user');
              document.getElementById("add-id").value = scannedCode;
              document.getElementById("add-floor").focus();
            }
          );
        }
      });
    }

    function onScanFailure(error) {
      // 持續掃描時忽略未對焦異常
    }

    function toggleAddCalendarType() {
      isAddRoc = !isAddRoc;
      const label = document.getElementById("add-date-label");
      const btn = event.target;
      const yearInput = document.getElementById("add-year");
      let currentVal = yearInput.value ? parseInt(yearInput.value, 10) : "";
      
      if (isAddRoc) {
        label.innerText = "到期日 (民國年) *";
        btn.innerText = "切換為西元年";
        if (currentVal && currentVal > 1900) {
          yearInput.value = currentVal - 1911;
        }
      } else {
        label.innerText = "到期日 (西元年) *";
        btn.innerText = "切換為民國年";
        if (currentVal && currentVal < 1900) {
          yearInput.value = currentVal + 1911;
        }
      }
    }

    function toggleModCalendarType() {
      isModRoc = !isModRoc;
      const label = document.getElementById("mod-date-label");
      const btn = document.getElementById("mod-date-btn");
      const yearInput = document.getElementById("mod-year");
      
      if (isModRoc) {
        label.innerText = "到期日 (民國年)";
        btn.innerText = "切換為西元年";
        if (currentModAdYear) {
          yearInput.value = currentModAdYear - 1911;
        }
      } else {
        label.innerText = "到期日 (西元年)";
        btn.innerText = "切換為民國年";
        if (currentModAdYear) {
          yearInput.value = currentModAdYear;
        }
      }
    }

    function parseInputDateToAd(yearInput, monthInput, dayInput, isRoc) {
      if (!yearInput || !monthInput || !dayInput) return null;
      let adYear = parseInt(yearInput, 10);
      if (isRoc) {
        adYear += 1911;
      }
      const mm = String(monthInput).padStart(2, '0');
      const dd = String(dayInput).padStart(2, '0');
      return `${adYear}/${mm}/${dd}`;
    }

    function parseFloorNum(floorStr) {
      if (!floorStr) return 0;
      const match = floorStr.match(/\d+/);
      return match ? parseInt(match[0], 10) : 0;
    }

    function getYearMonthString(dateStr) {
      if (!dateStr) return "";
      const normalized = dateStr.replace(/-/g, "/");
      const parts = normalized.split("/");
      if (parts.length >= 2) {
        let y = parseInt(parts[0], 10);
        if (y < 1900) y += 1911;
        const m = String(parseInt(parts[1], 10)).padStart(2, '0');
        return `${y}-${m}`;
      }
      return "";
    }

    function parseDateToObj(dateStr) {
      if (!dateStr) return { y: "", m: "", d: "", isRoc: false };
      const normalized = dateStr.replace(/-/g, "/");
      const parts = normalized.split("/");
      if (parts.length < 3) return { y: "", m: "", d: "", isRoc: false };
      let y = parseInt(parts[0], 10);
      let m = parseInt(parts[1], 10);
      let d = parseInt(parts[2], 10);
      
      if (y < 1900) {
        return { y: y, m: m, d: d, isRoc: true };
      }
      return { y: y, m: m, d: d, isRoc: false };
    }

    window.onload = function() {
      document.getElementById("loginBtn").addEventListener("click", function(){
        const btn = this; 
        const id = document.getElementById("loginId").value.trim();
        
        if(!id){ 
          showAlert("提示", "請輸入登入編號"); 
          return; 
        }
        
        const originalText = btn.textContent;
        btn.innerHTML = '<span class="spinner"></span> 驗證中...';
        btn.disabled = true;

        function restoreBtn() {
          btn.textContent = originalText;
          btn.disabled = false;
        }

        callGasApi("checkLoginById", id)
          .then(res => {
            restoreBtn(); 
            if(!res || !res.ok){ 
              showAlert("登入失敗", res && res.msg ? res.msg : "驗證失敗"); 
              return; 
            }
            currentUser = res;
            localStorage.setItem('fireExt_currentUser', JSON.stringify(res));
            document.getElementById("v-login").classList.add("hidden");
            document.getElementById("tabs-bar").classList.remove("hidden");
            document.getElementById("user-name-display").innerText = res.name;
            document.getElementById("user-id-display").innerText = res.id;
            switchView('v-scan', 't-scan');
            fetchAllData(false);
            document.getElementById("loginId").value = "";
          })
          .catch(err => {
            restoreBtn(); 
            showAlert("伺服器錯誤", err.toString());
          });
      });

      const savedUser = localStorage.getItem('fireExt_currentUser');
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        document.getElementById("v-login").classList.add("hidden");
        document.getElementById("tabs-bar").classList.remove("hidden");
        document.getElementById("user-name-display").innerText = currentUser.name;
        document.getElementById("user-id-display").innerText = currentUser.id;
        switchView('v-scan', 't-scan');

        const cachedData = localStorage.getItem('fireExt_allData');
        if (cachedData) {
          allData = JSON.parse(cachedData);
          renderUninspectedList();
          renderList();
        }
        fetchAllData(true); 
      }
    };

    function switchView(viewId, tabId) {
      ['v-scan', 'v-list', 'v-user'].forEach(id => document.getElementById(id).classList.add('hidden'));
      document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
      document.getElementById(viewId).classList.remove('hidden');
      if (tabId) document.getElementById(tabId).classList.add('active');
    }
    function showModal(id) { document.getElementById(id).style.display = "flex"; }
    function closeModal(id) { document.getElementById(id).style.display = "none"; }
    
    function showAlert(title, msg, callback = null) {
      document.getElementById("alert-title").innerText = title;
      document.getElementById("alert-message").innerText = msg;
      alertCallback = callback;
      showModal("modal-alert");
    }

    function closeAlertModal() {
      closeModal("modal-alert");
      if (typeof alertCallback === "function") {
        const cb = alertCallback;
        alertCallback = null;
        cb();
      }
    }

    // 新增：詢問是否新增滅火器用的確認彈窗函式
    function showConfirmModal(title, msg, onYesCallback) {
      document.getElementById("confirm-title").innerText = title;
      document.getElementById("confirm-message").innerText = msg;
      const yesBtn = document.getElementById("confirm-btn-yes");
      yesBtn.onclick = function() {
        closeModal("modal-confirm");
        if (typeof onYesCallback === "function") onYesCallback();
      };
      showModal("modal-confirm");
    }

    function handleCancelModify() {
      closeModal("modal-modify-ext");
      if (modifySource === "info") {
        showModal("modal-ext-info");
      }
    }

    function handleLogout() {
      currentUser = null; allData = [];
      localStorage.removeItem('fireExt_currentUser');
      localStorage.removeItem('fireExt_allData');

      document.getElementById("tabs-bar").classList.add("hidden");
      switchView('v-login', null);
      document.getElementById("loginId").value = "";
    }

    function fetchAllData(isBackground = false) {
      if (isBackground) document.getElementById("sync-indicator").innerText = "資料同步中...";
      
      callGasApi("getAllFireExtinguishers", null)
        .then(res => {
          if (res && res.ok) {
            allData = res.data;
            localStorage.setItem('fireExt_allData', JSON.stringify(allData));
            renderUninspectedList();
            renderList();
            if (isBackground) {
              document.getElementById("sync-indicator").innerText = "資料已更新至最新狀態";
              setTimeout(() => document.getElementById("sync-indicator").innerText = "", 3000);
            }
          }
        })
        .catch(err => console.error(err));
    }

    function renderUninspectedList() {
      const sortVal = document.getElementById("filter-sort-scan").value;
      
      let uninspected = allData.filter(d => {
        const lastCheckYM = getYearMonthString(d.lastCheckDate);
        return !d.lastCheckDate || lastCheckYM !== currentMonthStr;
      });
      
      if (sortVal === "high_low") {
        uninspected.sort((a, b) => parseFloorNum(b.floor) - parseFloorNum(a.floor));
      } else {
        uninspected.sort((a, b) => parseFloorNum(a.floor) - parseFloorNum(b.floor));
      }

      const container = document.getElementById("uninspected-list");
      if (uninspected.length === 0) {
        container.innerHTML = `<p style="color:green; text-align:center;">本月皆已檢查完畢！🎉</p>`;
        return;
      }
      container.innerHTML = uninspected.map(d => `
        <div class="list-item">
          <div>
            <strong>${d.floor}</strong> - ${d.location}
            <div style="font-size:12px; color:#777;">編號: ${d.code}</div>
            <div style="font-size:12px; color:#777;">到期: ${d.expireDate}</div>
            <div style="font-size:12px; color:#555; margin-top:2px;">最後檢查日: ${d.lastCheckDate || '無紀錄'}</div>
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <span class="list-badge bg-red">待檢查</span>
            <button class="btn-success btn-sm" onclick="handleManualCheckByRow(${d.rowIndex})">檢查</button>
          </div>
        </div>
      `).join('');
    }

    function renderList() {
      const sortVal = document.getElementById("filter-sort").value;
      const statusVal = document.getElementById("filter-status").value;
      
      let filtered = [...allData];

      if (statusVal === "done") {
        filtered = filtered.filter(d => getYearMonthString(d.lastCheckDate) === currentMonthStr);
      } else if (statusVal === "undone") {
        filtered = filtered.filter(d => getYearMonthString(d.lastCheckDate) !== currentMonthStr);
      }

      if (sortVal === "new_old") {
        filtered.sort((a, b) => new Date(b.expireDate || '1970') - new Date(a.expireDate || '1970'));
      } else if (sortVal === "old_new") {
        filtered.sort((a, b) => new Date(a.expireDate || '1970') - new Date(b.expireDate || '1970'));
      }

      const container = document.getElementById("all-data-list");
      if (filtered.length === 0) {
        container.innerHTML = `<p style="text-align:center; color:#888;">無符合條件的資料</p>`;
        return;
      }

      container.innerHTML = filtered.map(d => {
        const isDone = getYearMonthString(d.lastCheckDate) === currentMonthStr;
        return `
        <div class="list-item" style="flex-direction:column; align-items:flex-start;">
          <div style="width:100%; display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
            <strong>${d.code} (${d.floor})</strong>
            <span class="list-badge ${isDone ? 'bg-green' : 'bg-red'}">${isDone ? '已檢查' : '未檢查'}</span>
          </div>
          <div style="font-size:14px; color:#555;">位置：${d.location}</div>
          <div style="font-size:14px; color:#555;">到期：${d.expireDate}</div>
          <div style="font-size:14px; color:#555;">最後檢查日：${d.lastCheckDate || '無紀錄'}</div>
          <div style="width:100%; display:flex; justify-content:flex-end; gap:8px; margin-top:8px;">
            <button class="btn-outline btn-sm" onclick="handleDirectModifyByRow(${d.rowIndex})">修改資料</button>
          </div>
        </div>`;
      }).join('');
    }

    function handleManualCheckByRow(rowIndex) {
      const foundExt = allData.find(d => Number(d.rowIndex) === Number(rowIndex));
      if (foundExt) {
        selectedExt = { rowIndex: foundExt.rowIndex, data: foundExt };
        renderExtInfo(selectedExt.data);
        showModal("modal-ext-info");
      }
    }

    function handleDirectModifyByRow(rowIndex) {
      const foundExt = allData.find(d => Number(d.rowIndex) === Number(rowIndex));
      if (foundExt) {
        selectedExt = { rowIndex: foundExt.rowIndex, data: foundExt };
        modifySource = "list";
        openModifyModal();
      }
    }

    function renderExtInfo(d) {
      document.getElementById("ext-info-content").innerHTML = `
        <strong>編號：</strong> ${d.code}<br>
        <strong>樓層：</strong> ${d.floor}<br>
        <strong>位置：</strong> ${d.location}<br>
        <strong>到期日：</strong> ${d.expireDate}<br>
        <strong>壓力錶：</strong> <span style="color:${d.pressure==='正常'?'green':'red'}; font-weight:bold;">${d.pressure||'無'}</span><br>
        <strong>最後檢查日：</strong> ${d.lastCheckDate || '無紀錄'}<br>
        <strong>檢查人：</strong> ${d.lastChecker || '無'}
      `;
    }

    function submitCheckDirect(isNormal) {
      closeModal("modal-ext-info");
      
      const todayStr = `${currentYear}/${currentMonth}/${String(now.getDate()).padStart(2, '0')}`;
      const pressureStr = isNormal ? "正常" : "異常";

      const itemIndex = allData.findIndex(d => Number(d.rowIndex) === Number(selectedExt.rowIndex));
      if (itemIndex !== -1) {
        allData[itemIndex].pressure = pressureStr;
        allData[itemIndex].lastCheckDate = todayStr;
        allData[itemIndex].lastChecker = currentUser.name;
        localStorage.setItem('fireExt_allData', JSON.stringify(allData));
      }

      renderUninspectedList();
      renderList();
      showAlert("檢查成功", `已紀錄狀態：${pressureStr}`);

      callGasApi("updateFireExtinguisherData", {
        mode: "check", 
        rowIndex: selectedExt.rowIndex,
        pressure: pressureStr, 
        lastCheckDate: todayStr, 
        lastChecker: currentUser.name
      });
    }

    function openModifyModal() {
      if (document.getElementById("modal-ext-info").style.display === "flex") {
        modifySource = "info";
      }
      closeModal("modal-ext-info");
      const d = selectedExt.data;
      
      document.getElementById("mod-floor").value = d.floor || "";
      document.getElementById("mod-location").value = d.location || "";
      
      const dateObj = parseDateToObj(d.expireDate);
      isModRoc = dateObj.isRoc;
      
      const label = document.getElementById("mod-date-label");
      const btn = document.getElementById("mod-date-btn");
      const yearInput = document.getElementById("mod-year");
      
      currentModAdYear = isModRoc ? (dateObj.y + 1911) : dateObj.y;

      if (isModRoc) {
        label.innerText = "到期日 (民國年)";
        if(btn) btn.innerText = "切換為西元年";
        yearInput.value = dateObj.y;
      } else {
        label.innerText = "到期日 (西元年)";
        if(btn) btn.innerText = "切換為民國年";
        yearInput.value = dateObj.y;
      }

      document.getElementById("mod-month").value = dateObj.m;
      document.getElementById("mod-day").value = dateObj.d;
      
      document.getElementById("mod-pressure").value = d.pressure || "正常";
      showModal("modal-modify-ext");
    }

    function submitModify() {
      const y = document.getElementById("mod-year").value.trim();
      const m = document.getElementById("mod-month").value.trim();
      const d = document.getElementById("mod-day").value.trim();
      
      const adExpireDate = parseInputDateToAd(y, m, d, isModRoc);

      if (!adExpireDate) {
        return showAlert("提示", "請完整填寫到期日！", function() {
          showModal("modal-modify-ext");
        });
      }

      const todayStr = `${currentYear}/${currentMonth}/${String(now.getDate()).padStart(2, '0')}`;
      closeModal("modal-modify-ext");

      const itemIndex = allData.findIndex(item => Number(item.rowIndex) === Number(selectedExt.rowIndex));
      if (itemIndex !== -1) {
        allData[itemIndex].floor = document.getElementById("mod-floor").value;
        allData[itemIndex].location = document.getElementById("mod-location").value;
        allData[itemIndex].expireDate = adExpireDate;
        allData[itemIndex].pressure = document.getElementById("mod-pressure").value;
        allData[itemIndex].lastCheckDate = todayStr;
        allData[itemIndex].lastChecker = currentUser.name;
        localStorage.setItem('fireExt_allData', JSON.stringify(allData));
      }
      
      renderUninspectedList();
      renderList();
      showAlert("修改成功", "資料已同步更新！");

      callGasApi("updateFireExtinguisherData", {
        mode: "full", rowIndex: selectedExt.rowIndex,
        code: selectedExt.data.code, 
        floor: document.getElementById("mod-floor").value,
        location: document.getElementById("mod-location").value, 
        expireDate: adExpireDate,
        pressure: document.getElementById("mod-pressure").value,
        lastCheckDate: todayStr, 
        lastChecker: currentUser.name
      });
    }

    function submitAdd() {
      const code = document.getElementById("add-id").value.trim();
      const floor = document.getElementById("add-floor").value;
      const location = document.getElementById("add-location").value.trim();
      const y = document.getElementById("add-year").value.trim();
      const m = document.getElementById("add-month").value.trim();
      const d = document.getElementById("add-day").value.trim();

      if (!code || !floor || !location || !y || !m || !d) {
        return showAlert("提示", "新增滅火器所有欄位皆為必填！");
      }

      const isDuplicate = allData.some(item => item.code === code);
      if (isDuplicate) {
        return showAlert("提示", "已有該編號");
      }

      const adExpireDate = parseInputDateToAd(y, m, d, isAddRoc);
      const todayStr = `${currentYear}/${currentMonth}/${String(now.getDate()).padStart(2, '0')}`;

      showAlert("新增成功", `設備 ${code} 已加入清單！`);
      
      document.getElementById("add-id").value = "";
      document.getElementById("add-floor").value = "";
      document.getElementById("add-location").value = "";
      document.getElementById("add-year").value = "";
      document.getElementById("add-month").value = "";
      document.getElementById("add-day").value = "";

      callGasApi("addFireExtinguisherData", {
        code: code, floor: floor, location: location,
        expireDate: adExpireDate, pressure: "正常",
        lastCheckDate: todayStr, lastChecker: currentUser.name
      }).then(res => {
        if (res && res.ok) fetchAllData(false);
      });
    }
  </script>
</body>
</html>
