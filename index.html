<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4f7660">
  <title>滅火器巡檢系統</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root { --primary:#5d806b; --primary-dark:#3f5e4d; --bg:#f4f7f5; --danger:#c94b46; --warning:#a96810; }
    * { box-sizing:border-box; }
    body { margin:0; color:#26332b; background:var(--bg); font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button,input,select { font:inherit; }
    button { border:0; border-radius:10px; min-height:44px; padding:10px 14px; color:white; background:var(--primary); font-weight:700; cursor:pointer; }
    button:hover { filter:brightness(.95); } button:disabled { opacity:.55; cursor:not-allowed; }
    .secondary { background:#707a73; }.danger { background:var(--danger); }.outline { color:var(--primary-dark); background:white; border:1px solid var(--primary); }
    .app { max-width:760px; margin:auto; padding-bottom:32px; }
    header { padding:16px; color:white; background:var(--primary-dark); text-align:center; font-weight:700; }
    .tabs { display:flex; position:sticky; top:0; z-index:5; background:white; box-shadow:0 1px 4px #0002; }.tabs button { flex:1; min-height:48px; padding:8px; color:#6b746e; background:transparent; border-radius:0; }.tabs button.active { color:var(--primary-dark); box-shadow:inset 0 -3px var(--primary-dark); }
    main { padding:12px; }.panel { display:none; }.panel.active { display:block; }.card { padding:16px; margin-bottom:12px; background:white; border-radius:14px; box-shadow:0 2px 8px #17351c12; }
    h2,h3 { margin:0 0 12px; color:var(--primary-dark); } h2 { font-size:1.15rem; } h3 { font-size:1rem; }
    label { display:block; margin:10px 0 4px; font-size:.9rem; font-weight:650; } input,select { width:100%; min-height:44px; padding:9px 10px; border:1px solid #cbd4ce; border-radius:9px; background:white; }
    .row { display:flex; gap:10px; align-items:center; }.row > * { flex:1; }.row.compact > * { min-width:0; }.row.compact input { text-align:center; }
    .list-item { display:flex; gap:10px; justify-content:space-between; padding:13px 0; border-bottom:1px solid #e7ece8; }.list-item:last-child { border-bottom:0; }.details { min-width:0; }.details strong { font-size:1.05rem; }.muted { color:#66736b; font-size:.86rem; }.actions { display:flex; align-items:center; gap:7px; }.actions button { min-height:36px; padding:6px 10px; font-size:.85rem; }
    .badge { display:inline-block; margin-top:5px; padding:2px 7px; border-radius:999px; color:white; font-size:.76rem; font-weight:700; }.ok { background:#438558; }.pending { background:var(--danger); }.abnormal { background:var(--warning); }
    .floor-group { margin-top:14px; }.floor-group:first-child { margin-top:0; }.floor-heading { display:flex; justify-content:space-between; align-items:center; padding:9px 12px; color:white; background:var(--primary-dark); border-radius:9px; font-size:.95rem; font-weight:750; }.floor-count { padding:2px 8px; border-radius:99px; background:#ffffff2e; font-size:.82rem; }
    .toolbar { display:flex; gap:10px; align-items:center; }.toolbar select { max-width:170px; }.toolbar h2 { flex:1; margin:0; }.empty { margin:0; padding:20px; color:#66736b; text-align:center; }.notice { min-height:20px; color:#66736b; text-align:center; font-size:.85rem; } #sync-status { display:none; } #list .toolbar { flex-wrap:nowrap; } #list .toolbar select { flex:1; min-width:0; max-width:none; }
    .modal { display:none; position:fixed; inset:0; z-index:20; padding:16px; background:#0008; align-items:center; justify-content:center; }.modal.open { display:flex; }.dialog { width:min(100%,480px); max-height:90vh; overflow:auto; padding:20px; background:white; border-radius:16px; box-shadow:0 8px 32px #0005; }.dialog h2 { margin-bottom:10px; }.dialog .row:last-child { margin-top:16px; }.dialog .row button { flex:1; }
    #reader { overflow:hidden; min-height:250px; border-radius:10px; background:#111; cursor:crosshair; }.scanner-note { margin:8px 0 0; color:#56645b; text-align:center; font-size:.85rem; }.zoom-control { display:none; margin-top:12px; }.zoom-control.visible { display:block; }.zoom-control label { display:flex; justify-content:space-between; margin:0 0 5px; }.zoom-control input { accent-color:var(--primary-dark); padding:0; }
    .hidden { display:none!important; } @media (max-width:440px) { .list-item { flex-direction:column; }.actions { justify-content:flex-end; }.toolbar { align-items:flex-start; flex-wrap:wrap; }.toolbar h2 { flex-basis:100%; } #list .toolbar { flex-wrap:nowrap; } }
  </style>
</head>
<body>
  <div class="app">
    <header id="clock">滅火器巡檢系統</header>
    <nav id="tabs" class="tabs hidden">
      <button class="active" data-view="scan">巡檢</button><button data-view="list">清單</button><button data-view="account">帳號</button>
    </nav>
    <main>
      <section id="login" class="panel active"><div class="card"><h2>巡檢人員登入</h2><label for="login-id">員工編號</label><input id="login-id" autocomplete="username" placeholder="請輸入員工編號"><button id="login-button" style="width:100%;margin-top:12px">登入</button></div></section>
      <section id="scan" class="panel"><div class="card"><button id="scan-button" disabled style="width:100%">載入滅火器資料後即可掃描</button></div><div class="card"><div class="toolbar"><h2>本月未巡檢</h2><select id="pending-sort"><option value="high">樓層：高至低</option><option value="low">樓層：低至高</option></select></div><p id="sync-status" class="notice"></p><div id="pending-list"></div></div></section>
      <section id="list" class="panel"><div class="card"><div class="toolbar"><select id="list-sort"><option value="floor">依樓層</option><option value="new">到期日：新至舊</option><option value="old">到期日：舊至新</option></select><select id="list-status"><option value="all">全部狀態</option><option value="done">本月已巡檢</option><option value="pending">本月未巡檢</option></select></div><div id="all-list"></div></div></section>
      <section id="account" class="panel"><div class="card"><h2>帳號資訊</h2><p>姓名：<span id="user-name">-</span></p><p>員工編號：<span id="user-id">-</span></p><button id="logout" class="secondary" style="width:100%">登出</button></div><div class="card"><h2>新增滅火器</h2><form id="add-form"><label>編號</label><input name="code" required placeholder="例如 EXT-001"><label>樓層</label><select name="floor" required><option value="">請選擇樓層</option><option value="1F">1F</option><option value="2F">2F</option><option value="3F">3F</option><option value="4F">4F</option><option value="5F">5F</option><option value="6F">6F</option><option value="7F">7F</option><option value="8F">8F</option><option value="9F">9F</option></select><label>位置</label><input name="location" required placeholder="例如 電梯口"><label>到期日（民國年）</label><div class="row compact"><input name="rocYear" type="number" inputmode="numeric" min="1" required placeholder="115"><span>年</span><input name="rocMonth" type="number" inputmode="numeric" min="1" max="12" required placeholder="7"><span>月</span><input name="rocDay" type="number" inputmode="numeric" min="1" max="31" required placeholder="11"><span>日</span></div><button style="width:100%;margin-top:14px">新增</button></form></div></section>
    </main>
  </div>
  <div id="scanner-modal" class="modal"><div class="dialog"><h2>掃描滅火器條碼</h2><div id="reader"></div><p id="scan-status" class="scanner-note">正在啟動相機…</p><button id="stop-scan" class="secondary" style="width:100%;margin-top:12px">關閉掃描器</button></div></div>
  <div id="detail-modal" class="modal"><div class="dialog"><h2>滅火器資料</h2><div id="detail-content"></div><div class="row"><button id="check-normal">壓力正常</button><button id="check-abnormal" class="danger">壓力異常</button></div><button id="edit-button" class="outline" style="width:100%;margin-top:10px">編輯資料</button><button class="secondary close-modal" style="width:100%;margin-top:10px">關閉</button></div></div>
  <div id="edit-modal" class="modal"><div class="dialog"><h2>編輯滅火器</h2><form id="edit-form"><label>編號</label><input name="code" required><label>樓層</label><select name="floor" required><option value="1F">1F</option><option value="2F">2F</option><option value="3F">3F</option><option value="4F">4F</option><option value="5F">5F</option><option value="6F">6F</option><option value="7F">7F</option><option value="8F">8F</option><option value="9F">9F</option></select><label>位置</label><input name="location" required><label>到期日（民國年）</label><div class="row compact"><input name="rocYear" type="number" inputmode="numeric" min="1" required><span>年</span><input name="rocMonth" type="number" inputmode="numeric" min="1" max="12" required><span>月</span><input name="rocDay" type="number" inputmode="numeric" min="1" max="31" required><span>日</span></div><label>壓力狀態</label><select name="pressure"><option value="正常">正常</option><option value="異常">異常</option></select><div class="row"><button>儲存</button><button type="button" class="secondary close-modal">取消</button></div></form></div></div>
  <div id="alert-modal" class="modal"><div class="dialog"><h2 id="alert-title">提示</h2><p id="alert-message"></p><button class="close-modal" style="width:100%">確定</button></div></div>
  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyRUe4PUGsvo7AB64k1SLzkxZ5IlrWGYgndhWRzw3MBF4K-WxxD5pMD2s0hqx3LUnwl/exec';
    const state = { user:null, data:[], selected:null, scanner:null };
    const $ = id => document.getElementById(id);
    const today = () => new Date().toISOString().slice(0,10);
    const month = () => today().slice(0,7);
    const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const normalizeDate = value => String(value || '').replace(/\//g, '-').slice(0,10);
    const normalizeCode = value => String(value ?? '').trim().replace(/\s+/g, '').toUpperCase();
    const checkedThisMonth = item => normalizeDate(item.lastCheckDate).slice(0,7) === month();
    function showAlert(message, title='提示') { $('alert-title').textContent=title; $('alert-message').textContent=message; openModal('alert-modal'); }
    function openModal(id) { $(id).classList.add('open'); } function closeModal(id) { $(id).classList.remove('open'); }
    function api(action, payload) { return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,payload})}).then(r=>r.json()); }
    function floorValue(value) { const v=String(value||''); const n=Number((v.match(/\d+/)||['999'])[0]); return /b/i.test(v) ? -n : n; }
    function setView(id) { document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===id)); document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===id)); if(id==='list') renderAll(); if(id==='scan') renderPending(); }
    function itemMarkup(item, actions=true) { const isDone=checkedThisMonth(item), pressure=String(item.pressure||'正常'); const pressureClass=pressure==='正常'?'ok':'abnormal'; return `<div class="list-item"><div class="details"><strong>${escapeHtml(item.floor)} · ${escapeHtml(item.location)}</strong><div class="muted">編號：${escapeHtml(item.code)}　到期日：${escapeHtml(item.expireDate || '-')}</div><div class="muted">上次巡檢：${escapeHtml(item.lastCheckDate || '尚未巡檢')} ${item.lastChecker ? `(${escapeHtml(item.lastChecker)})` : ''}</div><span class="badge ${isDone?'ok':'pending'}">${isDone?'本月已巡檢':'本月未巡檢'}</span><span class="badge ${pressureClass}">壓力${escapeHtml(pressure)}</span></div>${actions?`<div class="actions"><button data-detail="${item.rowIndex}">查看</button></div>`:''}</div>`; }
    function renderPending() { const direction=$('pending-sort').value; const items=state.data.filter(x=>!checkedThisMonth(x)).sort((a,b)=>(floorValue(a.floor)-floorValue(b.floor))*(direction==='high'?-1:1)); $('pending-list').innerHTML=items.length?items.map(x=>itemMarkup(x)).join(''):'<p class="empty">本月所有滅火器皆已巡檢。</p>'; }
    function renderAll() { let items=[...state.data]; const status=$('list-status').value, sort=$('list-sort').value; if(status==='done')items=items.filter(checkedThisMonth); if(status==='pending')items=items.filter(x=>!checkedThisMonth(x)); items.sort((a,b)=>sort==='floor'?floorValue(a.floor)-floorValue(b.floor):(normalizeDate(a.expireDate).localeCompare(normalizeDate(b.expireDate))*(sort==='new'?-1:1))); if(!items.length) { $('all-list').innerHTML='<p class="empty">沒有符合條件的資料。</p>'; return; } if(sort!=='floor') { $('all-list').innerHTML=items.map(x=>itemMarkup(x)).join(''); return; } const groups=new Map(); items.forEach(item=>{const floor=String(item.floor||'未設定'); if(!groups.has(floor))groups.set(floor,[]); groups.get(floor).push(item);}); $('all-list').innerHTML=[...groups.entries()].map(([floor,group])=>`<section class="floor-group"><div class="floor-heading"><span>${escapeHtml(floor)}</span><span class="floor-count">${group.length} 支</span></div>${group.map(x=>itemMarkup(x)).join('')}</section>`).join(''); }
    function render() { renderPending(); renderAll(); }
    async function refresh(background=false) { if(background)$('sync-status').textContent='正在載入所有滅火器編號…'; $('scan-button').disabled=true; try { const res=await api('getAllFireExtinguishers',null); if(!res?.ok)throw new Error(res?.msg||'無法取得資料'); state.data=Array.isArray(res.data)?res.data:[]; localStorage.setItem('fireExt_allData',JSON.stringify(state.data)); render(); if(background)$('sync-status').textContent=`已載入 ${state.data.length} 支滅火器，可開始掃描`; } catch(error) { console.error(error); if(!state.data.length)state.data=JSON.parse(localStorage.getItem('fireExt_allData')||'[]'); render(); if(background)$('sync-status').textContent=state.data.length?'同步失敗，使用已儲存資料':'載入資料失敗，暫時無法掃描'; } finally { const ready=state.data.length>0; $('scan-button').disabled=!ready; $('scan-button').textContent=ready?'開啟條碼／QR Code 掃描器':'載入滅火器資料後即可掃描'; } }
    function showDetail(rowIndex) { state.selected=state.data.find(x=>String(x.rowIndex)===String(rowIndex)); if(!state.selected)return; const x=state.selected; $('detail-content').innerHTML=`<p><b>編號：</b>${escapeHtml(x.code)}</p><p><b>樓層：</b>${escapeHtml(x.floor)}</p><p><b>位置：</b>${escapeHtml(x.location)}</p><p><b>到期日：</b>${escapeHtml(x.expireDate)}</p><p><b>壓力：</b>${escapeHtml(x.pressure||'正常')}</p><p><b>上次巡檢：</b>${escapeHtml(x.lastCheckDate||'尚未巡檢')}</p>`; openModal('detail-modal'); }
    async function saveCheck(pressure) { if(!state.selected||!state.user)return; const item=state.selected; const payload={mode:'check',rowIndex:item.rowIndex,pressure,lastCheckDate:today(),lastChecker:state.user.name}; try { const res=await api('updateFireExtinguisherData',payload); if(!res?.ok)throw new Error(res?.msg); Object.assign(item,payload); closeModal('detail-modal'); render(); showAlert('巡檢紀錄已儲存。','完成'); } catch(error) { showAlert(error.message||'儲存巡檢結果失敗','錯誤'); } }
    async function startScanner() { if(!state.data.length)return showAlert('滅火器資料尚未載入完成，請稍候再試。'); if(!window.Html5Qrcode){showAlert('掃描元件載入失敗，請確認網路連線。','錯誤');return;} openModal('scanner-modal'); $('scan-status').textContent='正在啟動相機…'; try { state.scanner ||= new Html5Qrcode('reader'); const formats=window.Html5QrcodeSupportedFormats; const supported=[formats?.CODE_128,formats?.CODE_39,formats?.CODE_93,formats?.CODE_39_VIN,formats?.EAN_13,formats?.EAN_8,formats?.UPC_A,formats?.UPC_E,formats?.ITF,formats?.QR_CODE].filter(Number.isInteger); await state.scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:300,height:120},aspectRatio:2.5,disableFlip:true,formatsToSupport:supported},text=>{ const scannedCode=normalizeCode(text); stopScanner(); const item=state.data.find(x=>normalizeCode(x.code)===scannedCode); item?showDetail(item.rowIndex):showAlert(`已讀取條碼「${text}」，但資料表中找不到相同的滅火器編號。`); }); $('scan-status').textContent='請將橫向條碼完整置於掃描框內'; } catch(error) { console.error(error); stopScanner(); showAlert('無法啟動相機。請允許相機權限，並以 HTTPS 網址開啟頁面。','相機錯誤'); } }
    async function stopScanner() { try { if(state.scanner?.isScanning)await state.scanner.stop(); } catch(error) { console.warn(error); } closeModal('scanner-modal'); }
    $('login-button').onclick=async()=>{ const id=$('login-id').value.trim(); if(!id)return showAlert('請輸入員工編號。'); $('login-button').disabled=true; try { const res=await api('checkLoginById',id); if(!res?.ok)throw new Error(res?.msg||'登入失敗'); state.user=res; localStorage.setItem('fireExt_currentUser',JSON.stringify(res)); $('user-name').textContent=res.name; $('user-id').textContent=res.id; $('login').classList.remove('active'); $('tabs').classList.remove('hidden'); setView('scan'); await refresh(true); } catch(error) { showAlert(error.message||'登入失敗','錯誤'); } finally { $('login-button').disabled=false; } };
    document.querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>setView(button.dataset.view)); document.querySelectorAll('.close-modal').forEach(button=>button.onclick=()=>button.closest('.modal').classList.remove('open')); document.addEventListener('click',event=>{const b=event.target.closest('[data-detail]');if(b)showDetail(b.dataset.detail);}); $('pending-sort').onchange=renderPending; $('list-sort').onchange=renderAll; $('list-status').onchange=renderAll; $('scan-button').onclick=startScanner; $('stop-scan').onclick=stopScanner; $('check-normal').onclick=()=>saveCheck('正常'); $('check-abnormal').onclick=()=>saveCheck('異常');
    $('edit-button').onclick=()=>{const x=state.selected;if(!x)return; const f=$('edit-form'); ['code','floor','location','expireDate','pressure'].forEach(k=>f.elements[k].value=k==='expireDate'?normalizeDate(x[k]):(x[k]||'')); closeModal('detail-modal');openModal('edit-modal');};
    $('edit-form').onsubmit=async event=>{event.preventDefault();const values=Object.fromEntries(new FormData(event.target));const item=state.selected;const payload={mode:'full',rowIndex:item.rowIndex,...values,lastCheckDate:today(),lastChecker:state.user.name};try{const res=await api('updateFireExtinguisherData',payload);if(!res?.ok)throw new Error(res?.msg);Object.assign(item,payload);closeModal('edit-modal');render();showAlert('資料已更新。','完成');}catch(error){showAlert(error.message||'更新失敗','錯誤');}};
    $('add-form').onsubmit=async event=>{event.preventDefault();const values=Object.fromEntries(new FormData(event.target));if(state.data.some(x=>String(x.code)===values.code))return showAlert('此滅火器編號已存在。');const payload={...values,pressure:'正常',lastCheckDate:today(),lastChecker:state.user.name};try{const res=await api('addFireExtinguisherData',payload);if(!res?.ok)throw new Error(res?.msg);event.target.reset();await refresh();showAlert('已新增滅火器。','完成');}catch(error){showAlert(error.message||'新增失敗','錯誤');}};
    $('logout').onclick=()=>{state.user=null;state.data=[];localStorage.removeItem('fireExt_currentUser');$('tabs').classList.add('hidden');setView('login');};
    $('clock').textContent = '滅火器巡檢系統';
  </script>
  <div id="barcode-not-found-modal" class="modal"><div class="dialog"><h2>找不到滅火器</h2><p id="barcode-not-found-message"></p><p class="muted">是否要以此條碼編號新增滅火器？</p><div class="row"><button id="add-scanned-ext">新增滅火器</button><button id="cancel-scanned-ext" type="button" class="secondary">取消</button></div></div></div>
  <div id="swap-modal" class="modal"><div class="dialog"><h2>更換滅火器位置</h2><p id="swap-current" class="muted"></p><label for="swap-target">選擇要交換的滅火器編號</label><select id="swap-target"></select><p class="muted">只會交換兩台滅火器的樓層與位置；編號、日期、壓力與巡檢紀錄不會變更。</p><div class="row"><button id="confirm-swap">確認交換</button><button id="cancel-swap" type="button" class="secondary">取消</button></div></div></div>
  <script>
    // 一維條碼處理與位置交換功能：覆寫原本偏 QR Code 的掃描按鈕行為。
    let pendingScannedCode = '';
    function openAddForScannedCode(code) {
      setView('account');
      const form = $('add-form');
      if (!form) { showAlert('新增表單尚未載入，請重新整理頁面後再試。', '錯誤'); return; }
      form.reset();
      form.elements.code.value = code;
      form.scrollIntoView({ behavior: 'smooth', block: 'start' });
      form.elements.floor.focus();
    }

    function showBarcodeNotFoundModal(code) {
      pendingScannedCode = code;
      $('barcode-not-found-message').textContent = `條碼「${code}」沒有對應的滅火器資料。`;
      openModal('barcode-not-found-modal');
    }

    function rocDateToAdDate(year, monthValue, day) {
      const adYear = Number(year) + 1911;
      const date = new Date(Date.UTC(adYear, Number(monthValue) - 1, Number(day)));
      if (!Number.isInteger(Number(year)) || Number(year) < 1 || date.getUTCFullYear() !== adYear || date.getUTCMonth() !== Number(monthValue) - 1 || date.getUTCDate() !== Number(day)) return null;
      return `${adYear}-${String(monthValue).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    }

    function adDateToRocDate(value) {
      const [year, monthValue, day] = normalizeDate(value).split('-').map(Number);
      return { year: year - 1911, month: monthValue, day };
    }

    function activeCameraTrack() {
      return $('reader').querySelector('video')?.srcObject?.getVideoTracks?.()[0] || null;
    }

    async function configureCameraZoom() {
      const control = $('zoom-control');
      const slider = $('zoom-slider');
      const track = activeCameraTrack();
      const capabilities = track?.getCapabilities?.();
      if (!track || !capabilities?.zoom) { control.classList.remove('visible'); return; }
      slider.min = capabilities.zoom.min;
      slider.max = capabilities.zoom.max;
      slider.step = capabilities.zoom.step || 0.1;
      slider.value = track.getSettings?.().zoom || capabilities.zoom.min;
      control.classList.add('visible');
      try {
        if (capabilities.focusMode?.includes('continuous')) await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
      } catch (error) { console.debug('連續對焦不受此相機支援', error); }
    }

    async function applyCameraZoom() {
      const track = activeCameraTrack();
      if (!track) return;
      try { await track.applyConstraints({ advanced: [{ zoom: Number($('zoom-slider').value) }] }); }
      catch (error) { console.debug('縮放設定失敗', error); }
    }

    async function refocusCamera() {
      const track = activeCameraTrack();
      const capabilities = track?.getCapabilities?.();
      if (!track || !capabilities?.focusMode) return;
      try {
        const focusMode = capabilities.focusMode.includes('single-shot') ? 'single-shot' : 'continuous';
        await track.applyConstraints({ advanced: [{ focusMode }] });
        $('scan-status').textContent = '正在重新對焦…';
        setTimeout(() => { if (state.scanner?.isScanning) $('scan-status').textContent = '請將橫向條碼完整置於掃描框內，可用下方滑桿縮放或點畫面重新對焦'; }, 450);
      } catch (error) { console.debug('相機不支援手動重新對焦', error); }
    }

    async function requestCameraAccess() {
      if (!navigator.mediaDevices?.getUserMedia) throw new Error('此瀏覽環境不支援相機存取。請使用部署後的 HTTPS 網址開啟系統。');
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
      stream.getTracks().forEach(track => track.stop());
      await new Promise(resolve => setTimeout(resolve, 180));
    }

    async function startBarcodeScanner() {
      if (!state.data.length) return showAlert('滅火器資料尚未載入完成，請稍候再試。');
      if (!window.Html5Qrcode) return showAlert('掃描元件載入失敗，請確認網路連線。', '錯誤');
      state.scanBusy = false;
      openModal('scanner-modal');
      $('scan-status').textContent = '正在啟動相機…';
      try {
        await requestCameraAccess();
        state.scanner ||= new Html5Qrcode('reader');
        const formats = window.Html5QrcodeSupportedFormats;
        const supported = Number.isInteger(formats?.CODE_128) ? [formats.CODE_128] : undefined;
        const scannerConfig = {
          fps: 30,
          qrbox: (width, height) => ({ width: Math.floor(Math.min(width * 0.92, 380)), height: Math.floor(Math.min(135, Math.max(90, height * 0.30)))}),
          disableFlip: true
        };
        if (supported) scannerConfig.formatsToSupport = supported;
        const onDetected = async text => {
          if (state.scanBusy) return;
          state.scanBusy = true;
          $('zoom-control').classList.remove('visible');
          await stopScanner();
          const item = state.data.find(entry => normalizeCode(entry.code) === normalizeCode(text));
          if (item) showDetail(item.rowIndex);
          else showBarcodeNotFoundModal(text.trim());
          state.scanBusy = false;
        };
        try {
          await state.scanner.start(
            { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
            scannerConfig,
            onDetected
          );
        } catch (optimizedError) {
          console.warn('快速相機設定不相容，改用相容模式', optimizedError);
          try { await state.scanner.clear(); } catch (clearError) { console.debug('重設掃描器', clearError); }
          state.scanner = new Html5Qrcode('reader');
          await state.scanner.start(
            { facingMode: 'environment' },
            { fps: 15, qrbox: { width: 280, height: 120 }, disableFlip: true },
            onDetected
          );
        }
        await configureCameraZoom();
        $('scan-status').textContent = '請將橫向條碼完整置於掃描框內，可用下方滑桿縮放或點畫面重新對焦';
      } catch (error) {
        console.error(error);
        await stopScanner();
        const denied = error?.name === 'NotAllowedError' || error?.name === 'SecurityError';
        showAlert(denied ? '相機權限未被允許。請在網站網址列的鎖頭圖示中將「相機」設為允許，然後重新整理頁面。若目前網址是 file:///，請先部署並改用 HTTPS 網址。' : (error.message || '無法啟動相機。請使用 HTTPS 網址開啟頁面。'), '相機錯誤');
      }
    }

    function openSwapModal() {
      const current = state.selected;
      if (!current) return;
      const candidates = state.data.filter(item => String(item.rowIndex) !== String(current.rowIndex));
      if (!candidates.length) return showAlert('目前沒有其他滅火器可交換位置。');
      $('swap-current').textContent = `目前：${current.code}（${current.floor} · ${current.location}）`;
      $('swap-target').innerHTML = candidates.map(item => `<option value="${escapeHtml(item.rowIndex)}">${escapeHtml(item.code)}（${escapeHtml(item.floor)} · ${escapeHtml(item.location)}）</option>`).join('');
      openModal('swap-modal');
    }

    function fullUpdatePayload(item) {
      return { mode: 'full', rowIndex: item.rowIndex, code: item.code, floor: item.floor, location: item.location, expireDate: item.expireDate, pressure: item.pressure || '正常', lastCheckDate: item.lastCheckDate || '', lastChecker: item.lastChecker || '' };
    }

    async function swapLocations() {
      const first = state.selected;
      const second = state.data.find(item => String(item.rowIndex) === String($('swap-target').value));
      if (!first || !second) return;
      if (!window.confirm(`確認要交換「${first.code}」與「${second.code}」的樓層及位置嗎？`)) return;
      const firstFloor = first.floor, firstLocation = first.location, secondFloor = second.floor, secondLocation = second.location;
      first.floor = second.floor; first.location = second.location;
      second.floor = firstFloor; second.location = firstLocation;
      try {
        const results = await Promise.all([api('updateFireExtinguisherData', fullUpdatePayload(first)), api('updateFireExtinguisherData', fullUpdatePayload(second))]);
        if (results.some(result => !result?.ok)) throw new Error('部分資料未能更新');
        closeModal('swap-modal');
        closeModal('edit-modal');
        render();
        showAlert('兩台滅火器的位置已交換。', '完成');
      } catch (error) {
        first.floor = firstFloor; first.location = firstLocation;
        second.floor = secondFloor; second.location = secondLocation;
        await refresh();
        showAlert(error.message || '交換位置失敗，已重新載入資料。', '錯誤');
      }
    }

    const zoomControl = document.createElement('div');
    zoomControl.id = 'zoom-control'; zoomControl.className = 'zoom-control';
    zoomControl.innerHTML = '<label for="zoom-slider"><span>相機縮放</span><span>向右滑可拉近條碼</span></label><input id="zoom-slider" type="range" aria-label="相機縮放">';
    $('scanner-modal').querySelector('.dialog').insertBefore(zoomControl, $('scan-status'));
    $('zoom-slider').addEventListener('input', applyCameraZoom);
    $('stop-scan').addEventListener('click', () => $('zoom-control').classList.remove('visible'));

    const swapButton = document.createElement('button');
    swapButton.type = 'button'; swapButton.id = 'swap-button'; swapButton.textContent = '換位置';
    swapButton.style.width = '100%'; swapButton.style.marginTop = '14px';
    $('edit-form').insertBefore(swapButton, $('edit-form').querySelector('.row'));
    swapButton.addEventListener('click', openSwapModal);
    $('confirm-swap').addEventListener('click', swapLocations);
    $('cancel-swap').addEventListener('click', () => closeModal('swap-modal'));
    $('add-scanned-ext').addEventListener('click', () => { closeModal('barcode-not-found-modal'); openAddForScannedCode(pendingScannedCode); });
    $('cancel-scanned-ext').addEventListener('click', () => closeModal('barcode-not-found-modal'));
    $('add-form').onsubmit = async event => {
      event.preventDefault();
      const form = event.currentTarget;
      const values = Object.fromEntries(new FormData(form));
      const expireDate = rocDateToAdDate(values.rocYear, values.rocMonth, values.rocDay);
      if (!expireDate) return showAlert('請輸入有效的民國年月日。');
      if (state.data.some(item => normalizeCode(item.code) === normalizeCode(values.code))) return showAlert('此滅火器編號已存在。');
      const payload = { code: values.code.trim(), floor: values.floor, location: values.location.trim(), expireDate, pressure: '正常', lastCheckDate: today(), lastChecker: state.user.name };
      try {
        const result = await api('addFireExtinguisherData', payload);
        if (!result?.ok) throw new Error(result?.msg || '新增失敗');
        form.reset();
        await refresh();
        showAlert('已新增滅火器。', '完成');
      } catch (error) {
        showAlert(error.message || '新增失敗', '錯誤');
      }
    };
    $('edit-button').onclick = () => {
      const item = state.selected;
      if (!item) return;
      const form = $('edit-form');
      const rocDate = adDateToRocDate(item.expireDate);
      form.elements.code.value = item.code || '';
      form.elements.floor.value = item.floor || '1F';
      form.elements.location.value = item.location || '';
      form.elements.rocYear.value = rocDate.year || '';
      form.elements.rocMonth.value = rocDate.month || '';
      form.elements.rocDay.value = rocDate.day || '';
      form.elements.pressure.value = item.pressure || '正常';
      closeModal('detail-modal');
      openModal('edit-modal');
    };
    $('edit-form').onsubmit = async event => {
      event.preventDefault();
      const item = state.selected;
      const values = Object.fromEntries(new FormData(event.currentTarget));
      const expireDate = rocDateToAdDate(values.rocYear, values.rocMonth, values.rocDay);
      if (!expireDate) return showAlert('請輸入有效的民國年月日。');
      const payload = { mode: 'full', rowIndex: item.rowIndex, code: values.code.trim(), floor: values.floor, location: values.location.trim(), expireDate, pressure: values.pressure, lastCheckDate: today(), lastChecker: state.user.name };
      try {
        const result = await api('updateFireExtinguisherData', payload);
        if (!result?.ok) throw new Error(result?.msg || '更新失敗');
        Object.assign(item, payload);
        closeModal('edit-modal');
        render();
        showAlert('資料已更新。', '完成');
      } catch (error) {
        showAlert(error.message || '更新失敗', '錯誤');
      }
    };
    $('reader').addEventListener('click', refocusCamera);
    $('scan-button').onclick = startBarcodeScanner;
  </script>
</body>
</html>
