  <script>
    // 部署之 Google Apps Script API 網址
    const API_URL = "https://script.google.com/macros/s/AKfycbyRUe4PUGsvo7AB64k1SLzkxZ5IlrWGYgndhWRzw3MBF4K-WxxD5pMD2s0hqx3LUnwl/exec";

    let currentUser = null;

    const now = new Date();

    // 自動相容 GitHub Pages 與 Google Apps Script 通訊
    function callGasApi(action, payload) {
      return new Promise((resolve, reject) => {
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          let runner = google.script.run
            .withSuccessHandler(res => resolve(res))
            .withFailureHandler(err => reject(err));
          
          if (action === "checkLoginById") runner.checkLoginById(payload);
          else if (action === "getAllFireExtinguishers") runner.getAllFireExtinguishers();
          else if (action === "updateFireExtinguisherData") runner.updateFireExtinguisherData(payload);
          else if (action === "addFireExtinguisherData") runner.addFireExtinguisherData(payload);
        } else {
          fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: action, payload: payload })
          })
          .then(res => res.json())
          .then(res => resolve(res))
          .catch(err => reject(err));
        }
      });
    }

let html5QrCode = null;
let currentVideoTrack = null;

// 啟動相機掃描
function startScanner() {
  // 1. 以 modal 彈窗顯示
  const scannerModal = document.getElementById("scanner-container");
  scannerModal.style.display = "flex";
  scannerModal.classList.remove("hidden");
  document.getElementById("scan-status").innerText = "相機啟動中...";
  
  if (!html5QrCode) {
    // 開啟實驗性條碼硬體加速偵測 (大幅提高 1D/QR 條碼辨識率)
    html5QrCode = new Html5Qrcode("reader", { 
      experimentalFeatures: { useBarCodeDetectorIfSupported: true } 
    });
  }

  // 2. 優化掃描設定：提高 FPS、動態取景框適配一維條碼/QR Code
  const config = {
    fps: 15,                          // 提升至 15 偵，讓掃描更敏銳
    qrbox: { width: 250, height: 180 }, // 稍寬的長方形框，對一維條碼或 QR Code 都有良好相容性
    aspectRatio: 1.333,               // 對齊常見手機相機 4:3 比例
    videoConstraints: {
      facingMode: "environment",      // 強制使用後置鏡頭
      focusMode: "continuous",        // 請求連續自動對焦
      width: { min: 640, ideal: 1280 }, // 請求較高解析度輸入以利條碼解析
      height: { min: 480, ideal: 720 }
    }
  };

  html5QrCode.start(
    { facingMode: "environment" },
    config,
    onScanSuccess
  ).then(() => {
    document.getElementById("scan-status").innerText = "請將條碼對準紅線";
    // 檢查鏡頭是否支援縮放 (Zoom)
    initZoomControls();
  }).catch(err => {
    document.getElementById("scan-status").innerText = "";
    stopScanner();
    showAlert("相機啟動失敗", "請確定已授權相機權限，且網頁運行於 HTTPS 環境下。");
    console.error("相機錯誤:", err);
  });
}

// 關閉相機彈窗
function stopScanner() {
  const scannerModal = document.getElementById("scanner-container");
  if (html5QrCode && html5QrCode.isScanning) {
    html5QrCode.stop().then(() => {
      scannerModal.style.display = "none";
      scannerModal.classList.add("hidden");
      document.getElementById("zoom-control").classList.add("hidden");
    }).catch(err => {
      console.error(err);
      scannerModal.style.display = "none";
      scannerModal.classList.add("hidden");
    });
  } else {
    scannerModal.style.display = "none";
    scannerModal.classList.add("hidden");
  }
}

// --- 5. 樓層數字轉換輔助函式 ---
function parseFloorNum(floorStr) {
  if (!floorStr) return 999;
  const match = String(floorStr).match(/-?\d+/);
  if (match) {
    let num = parseInt(match[0], 10);
    if (String(floorStr).toUpperCase().includes("B")) {
      num = -Math.abs(num);
    }
    return num;
  }
  return 999;
}

// --- 6. 所有設備清單（按樓層低➔高自動分組，顯示：🏢 1F - 共 2 支）---
function renderList() {
  const sortVal = document.getElementById("filter-sort").value;
  const statusVal = document.getElementById("filter-status").value;
  
  let filtered = [...allData];

  // 1. 狀態篩選
  if (statusVal === "done") {
    filtered = filtered.filter(d => getYearMonthString(d.lastCheckDate) === currentMonthStr);
  } else if (statusVal === "undone") {
    filtered = filtered.filter(d => getYearMonthString(d.lastCheckDate) !== currentMonthStr);
  }

  const container = document.getElementById("all-data-list");
  if (filtered.length === 0) {
    container.innerHTML = `<p style="text-align:center; color:#888;">無符合條件的資料</p>`;
    return;
  }

  // 2. 排序與分組顯示邏輯
  if (sortVal === "default") {
    // 依樓層低到高排序
    filtered.sort((a, b) => parseFloorNum(a.floor) - parseFloorNum(b.floor));

    // 依樓層分組物件 { "1F": [item1, item2], "2F": [...] }
    const grouped = {};
    filtered.forEach(item => {
      const fl = item.floor || "未知樓層";
      if (!grouped[fl]) grouped[fl] = [];
      grouped[fl].push(item);
    });

    let htmlOutput = "";
    Object.keys(grouped).forEach(floor => {
      const items = grouped[floor];
      // 加入樓層統計標題
      htmlOutput += `
        <div style="background:var(--primary-dark); color:white; padding:8px 12px; border-radius:8px; margin:14px 0 8px 0; font-weight:bold; font-size:15px; display:flex; justify-content:space-between;">
          <span>樓層：${floor}</span>
          <span>共 ${items.length} 支</span>
        </div>
      `;
      // 輸出該樓層所有滅火器卡片
      items.forEach(d => {
        htmlOutput += createExtListItemHtml(d);
      });
    });

    container.innerHTML = htmlOutput;
  } else {
    // 如果是日期排序 (近➔遠 或 遠➔近)，不顯示樓層分組
    if (sortVal === "new_old") {
      filtered.sort((a, b) => new Date(b.expireDate || '1970') - new Date(a.expireDate || '1970'));
    } else if (sortVal === "old_new") {
      filtered.sort((a, b) => new Date(a.expireDate || '1970') - new Date(b.expireDate || '1970'));
    }
    container.innerHTML = filtered.map(d => createExtListItemHtml(d)).join('');
  }
}

// 產生單一滅火器列表卡片 HTML（方便重複利用）
function createExtListItemHtml(d) {
  const isDone = getYearMonthString(d.lastCheckDate) === currentMonthStr;
  return `
  <div class="list-item" style="flex-direction:column; align-items:flex-start;">
    <div style="width:100%; display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
      <strong>${d.code} (${d.floor})</strong>
      <span class="list-badge ${isDone ? 'bg-green' : 'bg-red'}">${isDone ? '已檢查' : '未檢查'}</span>
    </div>
    <div style="font-size:14px; color:#555;">位置：${d.location}</div>
    <div style="font-size:14px; color:#555;">到期：${d.expireDate}</div>
    <div style="font-size:14px; color:#555;">最後檢查日：${d.lastCheckDate || '無紀錄'}</div>
    <div style="width:100%; display:flex; justify-content:flex-end; gap:8px; margin-top:8px;">
      <button class="btn-outline btn-sm" onclick="handleDirectModifyByRow(${d.rowIndex})">修改資料</button>
    </div>
  </div>`;
}
    
    function toggleAddCalendarType() {
      isAddRoc = !isAddRoc;
      const label = document.getElementById("add-date-label");
      const btn = event.target;
      const yearInput = document.getElementById("add-year");
      let currentVal = yearInput.value ? parseInt(yearInput.value, 10) : "";
      
      if (isAddRoc) {
        label.innerText = "到期日 (民國年) *";
        btn.innerText = "切換為西元年";
        if (currentVal && currentVal > 1900) {
          yearInput.value = currentVal - 1911;
        }
      } else {
        label.innerText = "到期日 (西元年) *";
        btn.innerText = "切換為民國年";
        if (currentVal && currentVal < 1900) {
          yearInput.value = currentVal + 1911;
        }
      }
    }

    function toggleModCalendarType() {
      isModRoc = !isModRoc;
      const label = document.getElementById("mod-date-label");
      const btn = document.getElementById("mod-date-btn");
      const yearInput = document.getElementById("mod-year");
      
      if (isModRoc) {
        label.innerText = "到期日 (民國年)";
        btn.innerText = "切換為西元年";
        if (currentModAdYear) {
          yearInput.value = currentModAdYear - 1911;
        }
      } else {
        label.innerText = "到期日 (西元年)";
        btn.innerText = "切換為民國年";
        if (currentModAdYear) {
          yearInput.value = currentModAdYear;
        }
      }
    }

    function parseInputDateToAd(yearInput, monthInput, dayInput, isRoc) {
      if (!yearInput || !monthInput || !dayInput) return null;
      let adYear = parseInt(yearInput, 10);
      if (isRoc) {
        adYear += 1911;
      }
      const mm = String(monthInput).padStart(2, '0');
      const dd = String(dayInput).padStart(2, '0');
      return `${adYear}/${mm}/${dd}`;
    }


    function getYearMonthString(dateStr) {
      if (!dateStr) return "";
      const normalized = dateStr.replace(/-/g, "/");
      const parts = normalized.split("/");
      if (parts.length >= 2) {
        let y = parseInt(parts[0], 10);
        if (y < 1900) y += 1911;
        const m = String(parseInt(parts[1], 10)).padStart(2, '0');
        return `${y}-${m}`;
      }
      return "";
    }

    function parseDateToObj(dateStr) {
      if (!dateStr) return { y: "", m: "", d: "", isRoc: false };
      const normalized = dateStr.replace(/-/g, "/");
      const parts = normalized.split("/");
      if (parts.length < 3) return { y: "", m: "", d: "", isRoc: false };
      let y = parseInt(parts[0], 10);
      let m = parseInt(parts[1], 10);
      let d = parseInt(parts[2], 10);
      
      if (y < 1900) {
        return { y: y, m: m, d: d, isRoc: true };
      }
      return { y: y, m: m, d: d, isRoc: false };
    }

    window.onload = function() {
      document.getElementById("loginBtn").addEventListener("click", function(){
        const btn = this; 
        const id = document.getElementById("loginId").value.trim();
        
        if(!id){ 
          showAlert("提示", "請輸入登入編號"); 
          return; 
        }
        
        const originalText = btn.textContent;
        btn.innerHTML = '<span class="spinner"></span> 驗證中...';
        btn.disabled = true;

        function restoreBtn() {
          btn.textContent = originalText;
          btn.disabled = false;
        }

        callGasApi("checkLoginById", id)
          .then(res => {
            restoreBtn(); 
            if(!res || !res.ok){ 
              showAlert("登入失敗", res && res.msg ? res.msg : "驗證失敗"); 
              return; 
            }
            currentUser = res;
            localStorage.setItem('fireExt_currentUser', JSON.stringify(res));
            document.getElementById("v-login").classList.add("hidden");
            document.getElementById("tabs-bar").classList.remove("hidden");
            document.getElementById("user-name-display").innerText = res.name;
            document.getElementById("user-id-display").innerText = res.id;
            switchView('v-scan', 't-scan');
            fetchAllData(false);
            document.getElementById("loginId").value = "";
          })
          .catch(err => {
            restoreBtn(); 
            showAlert("伺服器錯誤", err.toString());
          });
      });

      const savedUser = localStorage.getItem('fireExt_currentUser');
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        document.getElementById("v-login").classList.add("hidden");
        document.getElementById("tabs-bar").classList.remove("hidden");
        document.getElementById("user-name-display").innerText = currentUser.name;
        document.getElementById("user-id-display").innerText = currentUser.id;
        switchView('v-scan', 't-scan');

        const cachedData = localStorage.getItem('fireExt_allData');
        if (cachedData) {
          allData = JSON.parse(cachedData);
          renderUninspectedList();
          renderList();
        }
        fetchAllData(true); 
      }
    };

    function switchView(viewId, tabId) {
      ['v-scan', 'v-list', 'v-user'].forEach(id => document.getElementById(id).classList.add('hidden'));
      document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
      document.getElementById(viewId).classList.remove('hidden');
      if (tabId) document.getElementById(tabId).classList.add('active');
    }
    function showModal(id) { document.getElementById(id).style.display = "flex"; }
    function closeModal(id) { document.getElementById(id).style.display = "none"; }
    
    function showAlert(title, msg, callback = null) {
      document.getElementById("alert-title").innerText = title;
      document.getElementById("alert-message").innerText = msg;
      alertCallback = callback;
      showModal("modal-alert");
    }

    function closeAlertModal() {
      closeModal("modal-alert");
      if (typeof alertCallback === "function") {
        const cb = alertCallback;
        alertCallback = null;
        cb();
      }
    }

    // 新增：詢問是否新增滅火器用的確認彈窗函式
    function showConfirmModal(title, msg, onYesCallback) {
      document.getElementById("confirm-title").innerText = title;
      document.getElementById("confirm-message").innerText = msg;
      const yesBtn = document.getElementById("confirm-btn-yes");
      yesBtn.onclick = function() {
        closeModal("modal-confirm");
        if (typeof onYesCallback === "function") onYesCallback();
      };
      showModal("modal-confirm");
    }

    function handleCancelModify() {
      closeModal("modal-modify-ext");
      if (modifySource === "info") {
        showModal("modal-ext-info");
      }
    }

    function handleLogout() {
      currentUser = null; allData = [];
      localStorage.removeItem('fireExt_currentUser');
      localStorage.removeItem('fireExt_allData');

      document.getElementById("tabs-bar").classList.add("hidden");
      switchView('v-login', null);
      document.getElementById("loginId").value = "";
    }

    function fetchAllData(isBackground = false) {
      if (isBackground) document.getElementById("sync-indicator").innerText = "資料同步中...";
      
      callGasApi("getAllFireExtinguishers", null)
        .then(res => {
          if (res && res.ok) {
            allData = res.data;
            localStorage.setItem('fireExt_allData', JSON.stringify(allData));
            renderUninspectedList();
            renderList();
            if (isBackground) {
              document.getElementById("sync-indicator").innerText = "資料已更新至最新狀態";
              setTimeout(() => document.getElementById("sync-indicator").innerText = "", 3000);
            }
          }
        })
        .catch(err => console.error(err));
    }

    function renderUninspectedList() {
      const sortVal = document.getElementById("filter-sort-scan").value;
      
      let uninspected = allData.filter(d => {
        const lastCheckYM = getYearMonthString(d.lastCheckDate);
        return !d.lastCheckDate || lastCheckYM !== currentMonthStr;
      });
      
      if (sortVal === "high_low") {
        uninspected.sort((a, b) => parseFloorNum(b.floor) - parseFloorNum(a.floor));
      } else {
        uninspected.sort((a, b) => parseFloorNum(a.floor) - parseFloorNum(b.floor));
      }

      const container = document.getElementById("uninspected-list");
      if (uninspected.length === 0) {
        container.innerHTML = `<p style="color:green; text-align:center;">本月皆已檢查完畢！🎉</p>`;
        return;
      }
      container.innerHTML = uninspected.map(d => `
        <div class="list-item">
          <div>
            <strong>${d.floor}</strong> - ${d.location}
            <div style="font-size:12px; color:#777;">編號: ${d.code}</div>
            <div style="font-size:12px; color:#777;">到期: ${d.expireDate}</div>
            <div style="font-size:12px; color:#555; margin-top:2px;">最後檢查日: ${d.lastCheckDate || '無紀錄'}</div>
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <span class="list-badge bg-red">待檢查</span>
            <button class="btn-success btn-sm" onclick="handleManualCheckByRow(${d.rowIndex})">檢查</button>
          </div>
        </div>
      `).join('');
    }
    function handleManualCheckByRow(rowIndex) {
      const foundExt = allData.find(d => Number(d.rowIndex) === Number(rowIndex));
      if (foundExt) {
        selectedExt = { rowIndex: foundExt.rowIndex, data: foundExt };
        renderExtInfo(selectedExt.data);
        showModal("modal-ext-info");
      }
    }

    function handleDirectModifyByRow(rowIndex) {
      const foundExt = allData.find(d => Number(d.rowIndex) === Number(rowIndex));
      if (foundExt) {
        selectedExt = { rowIndex: foundExt.rowIndex, data: foundExt };
        modifySource = "list";
        openModifyModal();
      }
    }

    function renderExtInfo(d) {
      document.getElementById("ext-info-content").innerHTML = `
        <strong>編號：</strong> ${d.code}<br>
        <strong>樓層：</strong> ${d.floor}<br>
        <strong>位置：</strong> ${d.location}<br>
        <strong>到期日：</strong> ${d.expireDate}<br>
        <strong>壓力錶：</strong> <span style="color:${d.pressure==='正常'?'green':'red'}; font-weight:bold;">${d.pressure||'無'}</span><br>
        <strong>最後檢查日：</strong> ${d.lastCheckDate || '無紀錄'}<br>
        <strong>檢查人：</strong> ${d.lastChecker || '無'}
      `;
    }

    function submitCheckDirect(isNormal) {
      closeModal("modal-ext-info");
      
      const todayStr = `${currentYear}/${currentMonth}/${String(now.getDate()).padStart(2, '0')}`;
      const pressureStr = isNormal ? "正常" : "異常";

      const itemIndex = allData.findIndex(d => Number(d.rowIndex) === Number(selectedExt.rowIndex));
      if (itemIndex !== -1) {
        allData[itemIndex].pressure = pressureStr;
        allData[itemIndex].lastCheckDate = todayStr;
        allData[itemIndex].lastChecker = currentUser.name;
        localStorage.setItem('fireExt_allData', JSON.stringify(allData));
      }

      renderUninspectedList();
      renderList();
      showAlert("檢查成功", `已紀錄狀態：${pressureStr}`);

      callGasApi("updateFireExtinguisherData", {
        mode: "check", 
        rowIndex: selectedExt.rowIndex,
        pressure: pressureStr, 
        lastCheckDate: todayStr, 
        lastChecker: currentUser.name
      });
    }

    function openModifyModal() {
      if (document.getElementById("modal-ext-info").style.display === "flex") {
        modifySource = "info";
      }
      closeModal("modal-ext-info");
      const d = selectedExt.data;
      
      document.getElementById("mod-floor").value = d.floor || "";
      document.getElementById("mod-location").value = d.location || "";
      
      const dateObj = parseDateToObj(d.expireDate);
      isModRoc = dateObj.isRoc;
      
      const label = document.getElementById("mod-date-label");
      const btn = document.getElementById("mod-date-btn");
      const yearInput = document.getElementById("mod-year");
      
      currentModAdYear = isModRoc ? (dateObj.y + 1911) : dateObj.y;

      if (isModRoc) {
        label.innerText = "到期日 (民國年)";
        if(btn) btn.innerText = "切換為西元年";
        yearInput.value = dateObj.y;
      } else {
        label.innerText = "到期日 (西元年)";
        if(btn) btn.innerText = "切換為民國年";
        yearInput.value = dateObj.y;
      }

      document.getElementById("mod-month").value = dateObj.m;
      document.getElementById("mod-day").value = dateObj.d;
      
      document.getElementById("mod-pressure").value = d.pressure || "正常";
      showModal("modal-modify-ext");
    }

    function submitModify() {
      const y = document.getElementById("mod-year").value.trim();
      const m = document.getElementById("mod-month").value.trim();
      const d = document.getElementById("mod-day").value.trim();
      
      const adExpireDate = parseInputDateToAd(y, m, d, isModRoc);

      if (!adExpireDate) {
        return showAlert("提示", "請完整填寫到期日！", function() {
          showModal("modal-modify-ext");
        });
      }

      const todayStr = `${currentYear}/${currentMonth}/${String(now.getDate()).padStart(2, '0')}`;
      closeModal("modal-modify-ext");

      const itemIndex = allData.findIndex(item => Number(item.rowIndex) === Number(selectedExt.rowIndex));
      if (itemIndex !== -1) {
        allData[itemIndex].floor = document.getElementById("mod-floor").value;
        allData[itemIndex].location = document.getElementById("mod-location").value;
        allData[itemIndex].expireDate = adExpireDate;
        allData[itemIndex].pressure = document.getElementById("mod-pressure").value;
        allData[itemIndex].lastCheckDate = todayStr;
        allData[itemIndex].lastChecker = currentUser.name;
        localStorage.setItem('fireExt_allData', JSON.stringify(allData));
      }
      
      renderUninspectedList();
      renderList();
      showAlert("修改成功", "資料已同步更新！");

      callGasApi("updateFireExtinguisherData", {
        mode: "full", rowIndex: selectedExt.rowIndex,
        code: selectedExt.data.code, 
        floor: document.getElementById("mod-floor").value,
        location: document.getElementById("mod-location").value, 
        expireDate: adExpireDate,
        pressure: document.getElementById("mod-pressure").value,
        lastCheckDate: todayStr, 
        lastChecker: currentUser.name
      });
    }

    function submitAdd() {
  const code = document.getElementById("add-id").value.trim();
  const floor = document.getElementById("add-floor").value;
  const location = document.getElementById("add-location").value.trim();
  const y = document.getElementById("add-year").value.trim();
  const m = document.getElementById("add-month").value.trim();
  const d = document.getElementById("add-day").value.trim();

  if (!code || !floor || !location || !y || !m || !d) {
    return showAlert("提示", "新增滅火器所有欄位皆為必填！");
  }

  const isDuplicate = allData.some(item => item.code === code);
  if (isDuplicate) {
    return showAlert("提示", "已有該編號");
  }

  const adExpireDate = parseInputDateToAd(y, m, d, isAddRoc);
  const todayStr = `${currentYear}/${currentMonth}/${String(now.getDate()).padStart(2, '0')}`;

  // 使用確認彈窗詢問是否新增
  showConfirmModal(
    "確認新增", 
    `確定要新增以下滅火器嗎？\n\n編號：${code}\n樓層：${floor}\n位置：${location}\n到期日：${adExpireDate}`, 
    function() {
      showAlert("新增成功", `設備 ${code} 已加入清單！`);

      // 清空輸入框
      document.getElementById("add-id").value = "";
      document.getElementById("add-floor").value = "";
      document.getElementById("add-location").value = "";
      document.getElementById("add-year").value = "";
      document.getElementById("add-month").value = "";
      document.getElementById("add-day").value = "";

      callGasApi("addFireExtinguisherData", {
        code: code, floor: floor, location: location,
        expireDate: adExpireDate, pressure: "正常",
        lastCheckDate: todayStr, lastChecker: currentUser.name
      }).then(res => {
        if (res && res.ok) fetchAllData(false);
      });
    }
  );
}
