<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <title>滅火器檢查系統</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --primary: #7e9e8d;      /* 莫蘭迪綠主色 */
      --primary-dark: #5a7b66; /* 深灰綠底色 */
      --bg: #f8faf9;           /* 灰綠調白背景 */
      --card: #ffffff;          /* 白色卡片背景 */
      --text: #333333;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 30px;
    }
    .card {
      background: var(--card);
      margin: 12px;
      padding: 16px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .hidden {
      display: none !important;
    }
    /* 管理頁面頂部導航欄 */
    #top-global-clock {
      background-color: var(--primary-dark);
      color: #ffffff;
      padding: 14px;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 0px;
    }
    /* Tabs 切換條 */
    .tabs {
      display: flex;
      background: #fff;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .tab-item {
      flex: 1;
      text-align: center;
      padding: 14px 5px;
      font-size: 15px;
      cursor: pointer;
      color: #777;
      transition: all 0.2s ease;
    }
    .tab-item.active {
      color: var(--primary-dark);
      border-bottom: 3px solid var(--primary-dark);
      font-weight: bold;
    }
    /* 按鈕與表單元素 */
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      font-size: 16px;
      margin-top: 8px;
      transition: opacity 0.2s, transform 0.1s;
    }
    button:active {
      transform: scale(0.98);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    button.btn-secondary { background: #888888; }
    button.btn-danger { background: #d9534f; }
    button.btn-success { background: #5cb85c; }

    input, select {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
      background: #fff;
    }
    /* 表格設計 */
    .roster-wrapper {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid #eee;
      background: white;
      margin-top: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      background: #fff;
    }
    th, td {
      border: 1px solid #eee;
      padding: 10px 6px;
      text-align: center;
    }
    th.header-bg {
      background: var(--bg);
      color: #555;
      font-weight: bold;
    }
    /* 彈窗遮罩與卡片 */
    .modal-overlay {
      position: fixed !important;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 11000;
    }
    .modal-card {
      background: white;
      padding: 22px;
      border-radius: 16px;
      width: 88%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0,0,0,0.3);
      max-height: 85vh;
      overflow-y: auto;
    }
    /* 掃描對焦區塊與中央紅線 */
    #reader-container {
      position: relative;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 10px;
      margin-bottom: 15px;
      display: none;
    }
    .scan-viewfinder {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 78%;
      height: 120px;
      transform: translate(-50%, -50%);
      border: 3px solid var(--primary);
      border-radius: 8px;
      box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.4);
      pointer-events: none;
      z-index: 10;
    }
    .scan-line {
      position: absolute;
      top: 50%;
      left: 6%;
      width: 88%;
      height: 2px;
      background: #ff4d4d;
      box-shadow: 0 0 6px #ff4d4d;
    }
  </style>
</head>
<body>

  <div id="top-global-clock">滅火器檢查系統</div>

  <!-- 登入卡片 -->
  <div id="v-login" class="card">
    <h3 style="text-align:center; color:var(--primary-dark); margin-top:5px;">人員登入</h3>
    <input type="text" id="loginId" placeholder="請輸入編號或密碼" onkeypress="if(event.key==='Enter') handleLogin()">
    <button id="loginBtn" onclick="handleLogin()">確認登入</button>
  </div>

  <!-- Tabs 導覽列 -->
  <div id="tabs-bar" class="tabs hidden">
    <div id="t-scan" class="tab-item active" onclick="switchView('v-scan', 't-scan')">掃描與檢查</div>
    <div id="t-list" class="tab-item" onclick="switchView('v-list', 't-list')">館內滅火器</div>
    <div id="t-user" class="tab-item" onclick="switchView('v-user', 't-user')">系統設定</div>
  </div>

  <!-- 視圖 1: 掃描與檢查 -->
  <div id="v-scan" class="card hidden">
    <button id="btn-start-scan" onclick="startScanner()">點擊啟動相機掃描條碼</button>
    <button id="btn-stop-scan" class="btn-secondary hidden" onclick="stopScanner()">停止掃描</button>
    
    <div id="reader-container">
      <div id="reader" style="width:100%;"></div>
      <div class="scan-viewfinder">
        <div class="scan-line"></div>
      </div>
    </div>

    <h4 style="margin-top:20px; margin-bottom:5px; color:var(--primary-dark); border-bottom:1px solid #eee; padding-bottom:6px;">本月尚未檢查的滅火器</h4>
    <div class="roster-wrapper">
      <table>
        <thead>
          <tr>
            <th class="header-bg">樓層</th>
            <th class="header-bg">位置</th>
          </tr>
        </thead>
        <tbody id="uninspected-tbody">
          <tr><td colspan="2">載入中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 視圖 2: 館內滅火器列表 -->
  <div id="v-list" class="card hidden">
    <div style="display:flex; gap:8px; margin-bottom:6px;">
      <select id="filter-sort" onchange="renderExtinguisherList()">
        <option value="ALL">全樓層 / 預設排序</option>
        <option value="NEW_OLD">到期日：新 → 舊</option>
        <option value="OLD_NEW">到期日：舊 → 新</option>
      </select>
      <select id="filter-status" onchange="renderExtinguisherList()">
        <option value="ALL">全部檢查狀態</option>
        <option value="CHECKED">本月已檢查</option>
        <option value="UNCHECKED">本月未檢查</option>
      </select>
    </div>

    <div class="roster-wrapper">
      <table>
        <thead>
          <tr>
            <th class="header-bg">編號</th>
            <th class="header-bg">樓層</th>
            <th class="header-bg">位置</th>
            <th class="header-bg">到期日</th>
            <th class="header-bg">壓力錶</th>
            <th class="header-bg">最後檢查日</th>
            <th class="header-bg">最後檢查人</th>
          </tr>
        </thead>
        <tbody id="all-extinguishers-tbody">
          <tr><td colspan="7">載入中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 視圖 3: 系統設定與個人資料 -->
  <div id="v-user" class="card hidden">
    <div style="border-bottom:1px solid #eee; padding-bottom:12px; margin-bottom:12px;">
      <h4 style="margin-top:0; color:var(--primary-dark);">當前使用者資料</h4>
      <p style="margin:8px 0;"><strong>姓名：</strong><span id="user-name-display">-</span></p>
      <p style="margin:8px 0;"><strong>編號：</strong><span id="user-id-display">-</span></p>
      <button class="btn-secondary" onclick="handleLogout()">登出系統</button>
    </div>

    <div>
      <h4 style="margin-top:0; color:var(--primary-dark);">更改密碼或編號</h4>
      <input type="text" id="old-id-input" placeholder="請輸入目前密碼/編號">
      <input type="text" id="new-id-input" placeholder="請輸入欲變更之新密碼/編號">
      <button onclick="handleChangeId()">儲存變更</button>
    </div>
  </div>

  <!-- 彈窗: 提示訊息 -->
  <div id="modal-alert" class="modal-overlay">
    <div class="modal-card">
      <h4 id="alert-title" style="margin-top:0; color:var(--primary-dark);">提示</h4>
      <p id="alert-message" style="margin:16px 0; line-height:1.6;"></p>
      <button onclick="closeModal('modal-alert')">確定</button>
    </div>
  </div>

  <!-- 彈窗: 滅火器詳細資訊 -->
  <div id="modal-ext-info" class="modal-overlay">
    <div class="modal-card" style="text-align:left;">
      <h4 style="text-align:center; color:var(--primary-dark); margin-top:0;">滅火器詳細資訊</h4>
      <div id="ext-info-content" style="font-size:14px; line-height:1.8;"></div>
      <div style="margin-top:16px;">
        <button onclick="openModifyModal()">修改資料</button>
        <button class="btn-success" onclick="openConfirmPressureModal()">執行檢查</button>
        <button class="btn-secondary" onclick="closeModal('modal-ext-info')">離開</button>
      </div>
    </div>
  </div>

  <!-- 彈窗: 確認壓力錶狀態 -->
  <div id="modal-pressure-confirm" class="modal-overlay">
    <div class="modal-card">
      <h4 style="margin-top:0; color:var(--primary-dark);">壓力錶檢查</h4>
      <p style="margin:18px 0; font-size:16px; font-weight:bold; color:#333;">是否確認壓力錶正常？</p>
      <button class="btn-success" onclick="submitPressure(true)">是，正常</button>
      <button class="btn-danger" onclick="submitPressure(false)">否，異常</button>
      <button class="btn-secondary" onclick="closeModal('modal-pressure-confirm')">取消</button>
    </div>
  </div>

  <!-- 彈窗: 修改滅火器資料 -->
  <div id="modal-modify-ext" class="modal-overlay">
    <div class="modal-card" style="text-align:left;">
      <h4 style="text-align:center; color:var(--primary-dark); margin-top:0;">修改滅火器資料</h4>
      <label style="font-size:12px; color:#666;">編號 (唯讀)</label>
      <input type="text" id="mod-id" disabled style="background:#eee;">
      <label style="font-size:12px; color:#666;">樓層</label>
      <input type="text" id="mod-floor">
      <label style="font-size:12px; color:#666;">位置</label>
      <input type="text" id="mod-location">
      <label style="font-size:12px; color:#666;">到期日 (YYYY-MM-DD)</label>
      <input type="date" id="mod-expiry">
      <label style="font-size:12px; color:#666;">壓力錶</label>
      <input type="text" id="mod-pressure">
      <label style="font-size:12px; color:#666;">最後檢查日</label>
      <input type="date" id="mod-lastDate">
      <label style="font-size:12px; color:#666;">最後檢查人</label>
      <input type="text" id="mod-lastUser">
      
      <button onclick="submitModifyExt()">確認修改</button>
      <button class="btn-secondary" onclick="closeModal('modal-modify-ext')">取消</button>
    </div>
  </div>

  <!-- 彈窗: 詢問新增滅火器 -->
  <div id="modal-add-ask" class="modal-overlay">
    <div class="modal-card">
      <h4 style="margin-top:0; color:var(--primary-dark);">查無該滅火器編號</h4>
      <p id="add-ask-text" style="margin:16px 0; line-height:1.6;"></p>
      <button class="btn-success" onclick="openAddFormModal()">是，新增此滅火器</button>
      <button class="btn-secondary" onclick="closeModal('modal-add-ask')">否，取消</button>
    </div>
  </div>

  <!-- 彈窗: 新增滅火器表單 -->
  <div id="modal-add-form" class="modal-overlay">
    <div class="modal-card" style="text-align:left;">
      <h4 style="text-align:center; color:var(--primary-dark); margin-top:0;">新增滅火器</h4>
      <label style="font-size:12px; color:#666;">編號 (自動帶入)</label>
      <input type="text" id="add-id" disabled style="background:#eee;">
      <label style="font-size:12px; color:#666;">樓層</label>
      <input type="text" id="add-floor" placeholder="請輸入樓層 (例：1F)">
      <label style="font-size:12px; color:#666;">位置</label>
      <input type="text" id="add-location" placeholder="請輸入放置位置 (例：大廳)">
      <label style="font-size:12px; color:#666;">到期日</label>
      <input type="date" id="add-expiry">
      
      <button onclick="submitAddExt()">確認新增</button>
      <button class="btn-secondary" onclick="closeModal('modal-add-form')">取消</button>
    </div>
  </div>

  <script>
    let currentUser = null;
    let extList = [];
    let html5QrcodeScanner = null;
    let selectedExt = null;
    let scannedBarcode = "";

    // ---------------- UI 與視圖控制 ----------------
    function switchView(viewId, tabId) {
      ['v-scan', 'v-list', 'v-user'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.querySelectorAll('.tab-item').forEach(t => {
        t.classList.remove('active');
      });
      
      document.getElementById(viewId).classList.remove('hidden');
      if (tabId) document.getElementById(tabId).classList.add('active');
    }

    function showModal(id) { document.getElementById(id).style.display = "flex"; }
    function closeModal(id) { document.getElementById(id).style.display = "none"; }
    function showAlert(title, msg) {
      document.getElementById("alert-title").innerText = title;
      document.getElementById("alert-message").innerText = msg;
      showModal("modal-alert");
    }

    // ---------------- 登入與權限管理 ----------------
    function handleLogin() {
      const idInput = document.getElementById("loginId").value.trim();
      if (!idInput) return showAlert("提示", "請輸入編號或密碼");
      
      const btn = document.getElementById("loginBtn");
      btn.disabled = true;
      btn.innerText = "驗證中...";

      google.script.run
        .withSuccessHandler(res => {
          btn.disabled = false;
          btn.innerText = "確認登入";
          if (res && res.ok) {
            currentUser = res;
            document.getElementById("v-login").classList.add("hidden");
            document.getElementById("tabs-bar").classList.remove("hidden");
            document.getElementById("user-name-display").innerText = res.name;
            document.getElementById("user-id-display").innerText = res.id;
            
            switchView('v-scan', 't-scan');
            loadAllExtinguishers();
          } else {
            showAlert("登入失敗", res ? res.msg : "系統無回應，請稍後再試");
          }
        })
        .withFailureHandler(err => {
          btn.disabled = false;
          btn.innerText = "確認登入";
          showAlert("連線錯誤", err.message || "無法連線至伺服器");
        })
        .checkLoginById(idInput);
    }

    function handleLogout() {
      stopScanner();
      currentUser = null;
      document.getElementById("tabs-bar").classList.add("hidden");
      ['v-scan', 'v-list', 'v-user'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById("v-login").classList.remove("hidden");
      document.getElementById("loginId").value = "";
    }

    function handleChangeId() {
      const oldId = document.getElementById("old-id-input").value.trim();
      const newId = document.getElementById("new-id-input").value.trim();
      if (!oldId || !newId) return showAlert("提示", "請填寫完整舊編號與新編號");
      
      google.script.run
        .withSuccessHandler(res => {
          if (res && res.ok) {
            showAlert("成功", "密碼編號已更新，請使用新編號重新登入！");
            document.getElementById("old-id-input").value = "";
            document.getElementById("new-id-input").value = "";
            handleLogout();
          } else {
            showAlert("變更失敗", res ? res.msg : "變更失敗");
          }
        })
        .changeUserId(oldId, newId);
    }

    // ---------------- 滅火器資料處理與渲染 ----------------
    function loadAllExtinguishers() {
      google.script.run
        .withSuccessHandler(res => {
          if (res && res.ok) {
            extList = res.data || [];
            renderUninspectedTable();
            renderExtinguisherList();
          } else {
            showAlert("載入錯誤", res ? res.msg : "讀取資料失敗");
          }
        })
        .getExtinguishers();
    }

    function isCheckedThisMonth(dateStr) {
      if (!dateStr) return false;
      const currentMonth = new Date().toISOString().slice(0, 7);
      return String(dateStr).startsWith(currentMonth);
    }

    function renderUninspectedTable() {
      const tbody = document.getElementById("uninspected-tbody");
      const uninspected = extList.filter(item => !isCheckedThisMonth(item.lastDate));
      
      if (uninspected.length === 0) {
        tbody.innerHTML = '<tr><td colspan="2" style="color:green; font-weight:bold;">恭喜，本月全館滅火器皆已檢查完成！</td></tr>';
        return;
      }
      tbody.innerHTML = uninspected.map(item => `
        <tr>
          <td>${item.floor || ''}</td>
          <td>${item.location || ''}</td>
        </tr>
      `).join('');
    }

    function renderExtinguisherList() {
      const sortVal = document.getElementById("filter-sort").value;
      const statusVal = document.getElementById("filter-status").value;
      
      let list = [...extList];
      
      if (statusVal === "CHECKED") {
        list = list.filter(item => isCheckedThisMonth(item.lastDate));
      } else if (statusVal === "UNCHECKED") {
        list = list.filter(item => !isCheckedThisMonth(item.lastDate));
      }
      
      if (sortVal === "NEW_OLD") {
        list.sort((a, b) => (b.expiry || "").localeCompare(a.expiry || ""));
      } else if (sortVal === "OLD_NEW") {
        list.sort((a, b) => (a.expiry || "").localeCompare(b.expiry || ""));
      }
      
      const tbody = document.getElementById("all-extinguishers-tbody");
      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7">無對應條件的滅火器</td></tr>';
        return;
      }
      tbody.innerHTML = list.map(item => `
        <tr>
          <td><strong>${item.id}</strong></td>
          <td>${item.floor || ''}</td>
          <td>${item.location || ''}</td>
          <td>${item.expiry || ''}</td>
          <td style="color:${item.pressure === '正常' ? 'green' : 'red'}; font-weight:bold;">${item.pressure || '-'}</td>
          <td>${item.lastDate || ''}</td>
          <td>${item.lastUser || ''}</td>
        </tr>
      `).join('');
    }

    // ---------------- 相機條碼掃描模組 ----------------
    function startScanner() {
      document.getElementById("btn-start-scan").classList.add("hidden");
      document.getElementById("btn-stop-scan").classList.remove("hidden");
      document.getElementById("reader-container").style.display = "block";

      if (!html5QrcodeScanner) {
        html5QrcodeScanner = new Html5Qrcode("reader");
      }
      
      const config = { fps: 10, qrbox: { width: 280, height: 100 } };
      html5QrcodeScanner.start(
        { facingMode: "environment" },
        config,
        (decodedText) => {
          stopScanner();
          handleBarcodeScanned(decodedText.trim());
        },
        (error) => { /* 忽略幀讀取錯誤 */ }
      ).catch(err => {
        stopScanner();
        showAlert("相機開啟失敗", "請確認是否已授權瀏覽器開啟手機相機。");
      });
    }

    function stopScanner() {
      if (html5QrcodeScanner && html5QrcodeScanner.isScanning) {
        html5QrcodeScanner.stop().then(() => {
          document.getElementById("reader-container").style.display = "none";
        }).catch(err => console.error(err));
      } else {
        document.getElementById("reader-container").style.display = "none";
      }
      document.getElementById("btn-start-scan").classList.remove("hidden");
      document.getElementById("btn-stop-scan").classList.add("hidden");
    }

    function handleBarcodeScanned(code) {
      scannedBarcode = code;
      const target = extList.find(item => String(item.id).trim() === code);
      
      if (target) {
        selectedExt = target;
        document.getElementById("ext-info-content").innerHTML = `
          <strong>編號：</strong> ${target.id}<br>
          <strong>樓層：</strong> ${target.floor}<br>
          <strong>位置：</strong> ${target.location}<br>
          <strong>到期日：</strong> ${target.expiry}<br>
          <strong>壓力錶：</strong> <span style="color:${target.pressure === '正常' ? 'green' : 'red'}; font-weight:bold;">${target.pressure || '未紀錄'}</span><br>
          <strong>最後檢查日：</strong> ${target.lastDate || '無紀錄'}<br>
          <strong>最後檢查人：</strong> ${target.lastUser || '無紀錄'}
        `;
        showModal("modal-ext-info");
      } else {
        document.getElementById("add-ask-text").innerText = `條碼 [ ${code} ] 不在館內滅火器名單中，是否要立即新增此滅火器？`;
        showModal("modal-add-ask");
      }
    }

    // ---------------- 滅火器操作 (修改 / 檢查 / 新增) ----------------
    function openConfirmPressureModal() {
      closeModal("modal-ext-info");
      showModal("modal-pressure-confirm");
    }

    function submitPressure(isNormal) {
      closeModal("modal-pressure-confirm");
      
      const pressureStatus = isNormal ? "正常" : "異常";
      const todayStr = new Date().toISOString().slice(0, 10);

      // 前端背景先行更新（無感同步提升體驗）
      if (selectedExt) {
        selectedExt.pressure = pressureStatus;
        selectedExt.lastDate = todayStr;
        selectedExt.lastUser = currentUser ? currentUser.name : "";
        renderUninspectedTable();
        renderExtinguisherList();
      }

      google.script.run
        .withSuccessHandler(res => {
          if (res && res.ok) {
            showAlert("檢查成功", `壓力錶已紀錄為：${pressureStatus}`);
            loadAllExtinguishers();
          } else {
            showAlert("錯誤", res ? res.msg : "資料更新失敗");
          }
        })
        .inspectExtinguisher(selectedExt.row, isNormal, currentUser ? currentUser.name : "");
    }

    function openModifyModal() {
      closeModal("modal-ext-info");
      document.getElementById("mod-id").value = selectedExt.id;
      document.getElementById("mod-floor").value = selectedExt.floor || "";
      document.getElementById("mod-location").value = selectedExt.location || "";
      document.getElementById("mod-expiry").value = selectedExt.expiry || "";
      document.getElementById("mod-pressure").value = selectedExt.pressure || "";
      document.getElementById("mod-lastDate").value = selectedExt.lastDate || "";
      document.getElementById("mod-lastUser").value = selectedExt.lastUser || "";
      showModal("modal-modify-ext");
    }

    function submitModifyExt() {
      const data = {
        id: document.getElementById("mod-id").value,
        floor: document.getElementById("mod-floor").value.trim(),
        location: document.getElementById("mod-location").value.trim(),
        expiry: document.getElementById("mod-expiry").value,
        pressure: document.getElementById("mod-pressure").value.trim(),
        lastDate: document.getElementById("mod-lastDate").value,
        lastUser: document.getElementById("mod-lastUser").value.trim()
      };
      
      closeModal("modal-modify-ext");
      
      google.script.run
        .withSuccessHandler(res => {
          if (res && res.ok) {
            showAlert("修改成功", "滅火器資料已成功同步！");
            loadAllExtinguishers();
          } else {
            showAlert("錯誤", res ? res.msg : "修改失敗");
          }
        })
        .updateExtinguisher(selectedExt.row, data);
    }

    function openAddFormModal() {
      closeModal("modal-add-ask");
      document.getElementById("add-id").value = scannedBarcode;
      document.getElementById("add-floor").value = "";
      document.getElementById("add-location").value = "";
      document.getElementById("add-expiry").value = "";
      showModal("modal-add-form");
    }

    function submitAddExt() {
      const floor = document.getElementById("add-floor").value.trim();
      const location = document.getElementById("add-location").value.trim();
      const expiry = document.getElementById("add-expiry").value;
      
      if (!floor || !location) return showAlert("提示", "樓層與放置位置為必填欄位");

      const info = {
        id: scannedBarcode,
        floor: floor,
        location: location,
        expiry: expiry
      };

      closeModal("modal-add-form");
      
      google.script.run
        .withSuccessHandler(res => {
          if (res && res.ok) {
            showAlert("新增成功", "已成功建立滅火器資料！");
            loadAllExtinguishers();
          } else {
            showAlert("錯誤", res ? res.msg : "新增失敗");
          }
        })
        .addExtinguisher(info);
    }
  </script>
</body>
</html>
